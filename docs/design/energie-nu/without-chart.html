<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Energie nu zonder grafiek</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:24px 28px}
.cap{min-height:92px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}.cap.short{min-height:0}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;
position:relative;width:390px;height:360px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.live{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--muted)}.live i{width:7px;height:7px;border-radius:50%;background:#3fb950;box-shadow:0 0 0 3px rgba(63,185,80,.2)}
.card{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:14px 16px}
.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lbl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.big{font-size:40px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
/* B */
.cardB{display:flex;justify-content:space-between;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(63,185,80,.14);color:#7fd18b;font-size:12px;font-weight:600}.badge i{width:6px;height:6px;border-radius:50%;background:#3fb950}
/* C */
.row{display:flex;align-items:center;gap:14px;padding:12px 16px}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.row .txt{flex:1}.row .txt b{display:block;font-size:16px;font-weight:500}.row .txt small{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}.row .txt small i{width:6px;height:6px;border-radius:50%;background:#3fb950}
.row .num{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.row .num small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
/* D */
.tinted{background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);text-align:center;padding:22px 16px 20px}
.tinted .big{font-size:52px}.tinted .lbl{justify-content:center;color:color-mix(in srgb,var(--c) 70%,#fff)}
.tinted .badge{margin-bottom:10px}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={out:svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),in:svg('<path d="M12 5v14M6 13l6 6 6-6"/>')};
const head=(liveInHeading=true)=>`<div class="kicker">Categorie</div><h1>Energie</h1><div class="sec"><span>Nu</span>${liveInHeading?'<span class="live"><i></i>live</span>':''}</div>`;
const state=(isBack)=>({c:isBack?'var(--back)':'var(--from)',label:isBack?'Terug naar het net':'Van het net',value:isBack?'850':'220',icon:isBack?I.out:I.in});
const A=(b)=>{const s=state(b);return `${head()}<div class="card" style="--c:${s.c}"><span class="lbl"><i></i>${s.label}</span><div class="big">${s.value}<small>W</small></div></div>`;};
const B=(b)=>{const s=state(b);return `${head(false)}<div class="card cardB" style="--c:${s.c}"><div><span class="lbl"><i></i>${s.label}</span><div class="big">${s.value}<small>W</small></div></div><span class="badge"><i></i>Live</span></div>`;};
const C=(b)=>{const s=state(b);return `${head(false)}<div class="card" style="--c:${s.c};padding:0"><div class="row"><span class="tile">${s.icon}</span><span class="txt"><b>${s.label}</b><small><i></i>live</small></span><span class="num">${s.value}<small>W</small></span></div></div>`;};
const D=(b)=>{const s=state(b);return `${head(false)}<div class="card tinted" style="--c:${s.c}"><span class="badge"><i></i>Live</span><div class="big">${s.value}<small>W</small></div><span class="lbl">${s.label}</span></div>`;};
const phone=(h)=>`<div class="phone"><div class="in">${h}</div></div>`;
const S=[
 ['A · Zoals nu, zonder grafiek','De kaart van nu, alleen de grafiek eruit: label met bolletje, het grote getal dat meetelt. "live" staat rechts naast de kop "NU".',A(true)],
 ['B · Live-badge in de kaart','Hetzelfde, maar "Live" als groen badge rechtsboven in de kaart, met een pulserend bolletje. De kop is alleen "NU".',B(true)],
 ['C · Eén rij, zoals een bediening','Compact, zoals de rijen in een kamer: een icoon (pijl omhoog bij terugleveren, omlaag bij afnemen), het label met "live" eronder, en het getal rechts.',C(true)],
 ['D · Groot en gekleurd','De kaart kleurt mee: groen bij terugleveren, roze bij afnemen. Het getal groot in het midden, "Live" erboven, het label eronder.',D(true)],
 ['A · van het net','',A(false)],['B · van het net','',B(false)],['C · van het net','',C(false)],['D · van het net','',D(false)],
];
document.body.innerHTML=S.map(([t,sub,h],k)=>`<div><p class="cap${k>=4?' short':''}">${t}${sub?`<small>${sub}</small>`:''}</p>${phone(h)}</div>`).join('');
</script></html>
