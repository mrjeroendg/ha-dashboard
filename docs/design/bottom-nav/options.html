<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Compact nav</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(2,390px);gap:32px 28px}
.cap{min-height:52px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
position:relative;width:390px;height:150px;border-radius:28px;overflow:hidden;background:linear-gradient(#1e1e1c,#262624);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.dock{position:absolute;left:16px;right:16px;bottom:22px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;gap:4px;padding:6px;overflow:hidden;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08);
-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
/* current */
.cur .it{flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;color:var(--muted);font:500 14px -apple-system,system-ui,sans-serif;white-space:nowrap}
.cur .it svg{width:18px;height:18px}.cur .it.on{background:var(--accent);color:#fff}
/* stacked */
.stk{border-radius:30px}
.stk .it{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:24px;color:var(--muted);font:500 11px -apple-system,system-ui,sans-serif;white-space:nowrap}
.stk .it svg{width:22px;height:22px}
.a .it.on{background:rgba(245,244,239,.09);color:var(--text)}
.b .it.on{background:var(--soft);color:var(--accent)}
.d .it.on{color:var(--text)}.d .it.on svg{color:var(--accent)}.d .it{position:relative}.d .it.on::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
/* icons only, active shows label */
.c .it{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 11px;border-radius:999px;color:var(--muted);font:500 14px -apple-system,system-ui,sans-serif;white-space:nowrap}
.c .it svg{width:20px;height:20px}.c .it.on{background:var(--accent);color:#fff;padding:0 14px 0 12px}
</style></head><body></body>
<script>
const P={home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',sofa:'<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/>',baby:'<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>',monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>',garage:'<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>',coffee:'<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>'};
const items=[['home','Thuis'],['sofa','Living'],['baby','Marielou'],['monitor','Bureau'],['garage','Garage'],['coffee','Keuken']];
const it=(on,label=true)=>items.map(([ic,n],k)=>`<div class="it ${k===on?'on':''}"><svg viewBox="0 0 24 24">${P[ic]}</svg>${label||k===on?`<span>${n}</span>`:''}</div>`).join('');
const phone=(cls,inner)=>`<div class="phone"><div class="dock"><div class="bar ${cls}">${inner}</div></div></div>`;
const S=[
 ['Nu','Icoon en naam naast elkaar: ±3½ items passen, de rest scrollt.',phone('cur',it(1))],
 ['A · Gestapeld, zoals Netflix','Icoon boven een kleine naam (11px), vaste breedte. Actief = zacht lichter vlak. Er passen 5½.',phone('stk a',it(1))],
 ['B · Gestapeld, actief in oranje','Zelfde als A, actief met de oranje tint van de kamertabs.',phone('stk b',it(1))],
 ['C · Alleen iconen, naam bij actief','Het actieve item toont zijn naam; de rest alleen een icoon. Het meest compact: alles past.',phone('c',it(1,false))],
 ['D · Gestapeld, oranje icoon + stipje','Geen vlak: het actieve icoon is oranje met een stipje eronder. De rustigste.',phone('stk d',it(1))],
];
document.body.innerHTML=S.map(([c,s,h])=>`<div><p class="cap">${c}<small>${s}</small></p>${h}</div>`).join('');
</script></html>
