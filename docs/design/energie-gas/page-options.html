<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Gas als pagina</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{min-height:110px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--gas:#5cb8f2;--accent:#d97757;
position:relative;width:390px;height:760px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 18px;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 16px 8px}
.tile+.tile{margin-top:10px}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.name span{display:grid;color:var(--c)}
.values{display:flex;justify-content:space-between;align-items:baseline}
.value{margin:6px 0 0;font-size:26px;font-weight:600}.value small{margin-left:3px;font-size:13px;font-weight:500;color:var(--muted)}
.price{font-size:15px;font-weight:600}.price small{font-size:12px;font-weight:500;color:var(--muted);margin-right:3px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
svg.chart{display:block;width:100%;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(14,1fr);font-size:10px;color:var(--muted);text-align:center;margin-top:4px}.days span.today{color:var(--text);font-weight:700}
/* nav */
.nav{position:absolute;left:14px;right:14px;bottom:16px;border-radius:30px;background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:inset 0 0 0 1px var(--border)}
.scroller{display:flex;align-items:center;gap:4px;padding:6px 14px;overflow:hidden}
.item{flex:none;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 10px 7px;font-size:12px;color:var(--muted)}
.item svg{width:18px;height:18px}.item.on{color:var(--accent)}
.divider{flex:none;width:1px;height:30px;background:rgba(245,244,239,.14);margin:0 4px}
.group{display:flex;gap:0;padding:0 2px;border-radius:22px;background:rgba(245,244,239,.05);box-shadow:inset 0 0 0 1px rgba(245,244,239,.06);margin-right:6px}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={flame:svg('<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>'),bolt:svg('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),home:svg('<path d="M4 11l8-7 8 7v9H4z"/>'),sofa:svg('<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M3 11h18v6H3zM5 17v2M19 17v2"/>'),baby:svg('<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>'),calendar:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>')};
const GAS=[2.41,2.9,3.1,2.2,2.6,3.4,2.8,2.5,3.6,4.1,3.3,2.9,3.0,1.84];
const DAYS=['D','V','Z','Z','M','D','W','D','V','Z','Z','M','D','W'];
const fmt=(v,d=2)=>v.toLocaleString('nl-BE',{minimumFractionDigits:d,maximumFractionDigits:d});
function chart(values){const W=326,H=64,avg=values.slice(0,-1).reduce((s,v)=>s+v,0)/13,top=Math.max(...values)*1.15,slot=W/values.length,width=slot*.62,y=(v)=>H-(v/top)*H;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${values.map((v,i)=>`<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="2" fill="#5cb8f2" opacity="${i===13?1:.45}" stroke="none"/>`).join('')}<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f5f4ef" stroke-dasharray="3 3" opacity=".7"/><rect x="0" y="${y(avg)-16}" width="58" height="14" rx="4" fill="#262624" stroke="none"/><text x="5" y="${y(avg)-6}" font-size="10" fill="#f5f4ef" stroke="none">gem. ${fmt(avg)}</text></svg><div class="days">${DAYS.map((d,i)=>`<span class="${i===13?'today':''}">${d}</span>`).join('')}</div>`;}
const gasToday=`<div class="tile" style="--c:var(--gas)"><p class="name"><span>${I.flame}</span>Gas vandaag</p><div class="values"><p class="value">1,84<small>m³</small></p><span class="price"><small>≈</small>€ 2,02</span></div>${chart(GAS)}</div>`;
const month=`<div class="tile" style="--c:var(--gas);padding-bottom:12px"><p class="name"><span>${I.calendar}</span>Deze maand</p><div class="values"><p class="value">5,24<small>m³</small></p><span class="price"><small>≈</small>€ 5,76</span></div><div class="sub">Vorige maand tot 3 november: 4,80 m³ · ≈ 55 kWh</div></div>`;
const rooms=[[I.home,'Thuis'],[I.sofa,'Living'],[I.baby,'Marielou']];
const item=(icon,name,on)=>`<span class="item${on?' on':''}">${icon}<span>${name}</span></span>`;
const navA=`<div class="nav"><div class="scroller">${item(I.bolt,'Energie')}${item(I.flame,'Gas',true)}<span class="divider"></span>${rooms.map(([i,n])=>item(i,n)).join('')}</div></div>`;
const navC=`<div class="nav"><div class="scroller"><span class="group">${item(I.bolt,'Stroom')}${item(I.flame,'Gas',true)}</span>${rooms.map(([i,n])=>item(i,n)).join('')}</div></div>`;
const page=(title,body,nav)=>`<div class="in"><div class="kicker">Categorie</div><h1>${title}</h1>${body}</div>${nav}`;
const S=[
 ['G1 · Gas na Energie, voor de lijn','In de balk: Energie, Gas, dan het streepje en Thuis met de kamers. De Gas-pagina begint met dezelfde dagtegel als Energie: vandaag in m³, ≈ €, en de 14 dagen met hun gemiddelde.',page('Gas',gasToday,navA)],
 ['G2 · Categorieën als groep, Energie heet Stroom','Nu er twee categorieën zijn: samen in een licht omrande groep (optie C van toen), zonder streepje. En "Energie" wordt "Stroom", want gas is ook energie.',page('Gas',gasToday,navC)],
 ['G3 · Met deze maand erbij','Zoals G1, met een tweede tegel: wat de maand tot nu verbruikte, tegenover vorige maand op dezelfde dag, en omgerekend in kWh. Gas gaat vooral over seizoenen, dus een maand zegt meer dan een dag.',page('Gas',gasToday+'<div style="height:10px"></div>'+month,navA)],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone">${h}</div></div>`).join('');
</script></html>
