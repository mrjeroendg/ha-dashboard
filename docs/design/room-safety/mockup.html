<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Room status details</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);--red:#e5534b;--green:#199e70;--orange:#e8913a;--track:rgba(245,244,239,.12);
position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:56px 24px 0}
.lbl{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
h1{margin:0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:32px}
.v{text-align:right;flex:none}.v b{display:block;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:32px;line-height:1.15}.v span{display:block;font-size:13px;color:var(--muted)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.line{display:inline-flex;align-items:center;gap:6px;margin:3px 0 0;font-size:13px;color:var(--muted);padding:4px 8px 4px 0;border-radius:8px}
.line.lit{color:var(--text)}
.line .chev{width:12px;height:12px;color:var(--muted);transition:transform .2s}
.line.open .chev{transform:rotate(90deg)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--green)}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}
.tabs{display:flex;gap:6px;margin-top:18px}
.tab{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.tab.on{background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.group{margin-top:16px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px}.row+.row{box-shadow:inset 0 1px 0 var(--border)}
.ic{width:36px;height:36px;border-radius:12px;background:var(--bg);color:var(--accent);display:grid;place-items:center;flex:none}.ic svg{width:20px;height:20px}
.ic.on{background:var(--accent);color:#fff}
.t{flex:1}.t b{display:block;font-size:16px;font-weight:500}.t span{font-size:13px;color:var(--muted)}
.sw{width:48px;height:30px;border-radius:999px;background:var(--border);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)}.sw.on::after{left:auto;right:3px}
.nav{position:absolute;left:0;right:0;bottom:0;padding:24px 16px 22px;background:linear-gradient(transparent,var(--bg) 30%)}
.pills{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.pill{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}.pill svg{width:18px;height:18px}.pill.on{background:var(--accent);color:#fff}
/* details list */
.list{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.list .r{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:15px}
.list .r+.r{box-shadow:inset 0 1px 0 var(--border)}
.list .r svg{width:18px;height:18px;color:var(--muted);flex:none}
.list .r span{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.list .r span.red{color:var(--red)}.list .r span.orange{color:var(--orange)}
.list .r span.ok{color:var(--muted)}
/* inline */
.inline{margin-top:10px}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:#2b2b29;padding:10px 16px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.handle{width:36px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 14px}
.sheet h2{margin:0 4px 2px;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:24px}
.sheet p{margin:0 4px 14px;font-size:13px;color:var(--muted)}
/* popover */
.pop{position:absolute;left:20px;right:20px;top:152px;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(245,244,239,.1);background:#353532}
.pop::before{content:"";position:absolute;left:34px;top:-7px;width:14px;height:14px;background:#353532;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(245,244,239,.1)}
.pop .list{background:transparent;box-shadow:none}

.list .r .tt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;margin-left:0;text-align:left;font-size:15px;color:var(--text)}
.list .r .tt small{font-size:12px;color:var(--muted);margin-top:1px;margin-left:0}
.list .r .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-align:right}
.list .r .st.red{color:var(--red)}.list .r .st.orange{color:var(--orange)}
.sheet .sub{display:flex;align-items:center;gap:6px}
.sheet .sec{margin:18px 6px 8px;font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
</style></head><body></body>
<script>
const P={door:'<path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01"/>',smoke:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',co:'<path d="M4 15a8 8 0 1 1 16 0M12 15l4-4"/>',chev:'<path d="M9 6l6 6-6 6"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',sofa:'<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/>'};
const i=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const BAD=[['door','Achterdeur','Open','red',''],['door','Garagepoort','Open','red',''],['smoke','Rookmelder','Batterij 12%','orange','']];
const OKI=[['door','Voordeur','Op slot','',''],['door','Raam','Dicht','','']];
const ALLOK=[['door','Voordeur','Op slot','',''],['door','Achterdeur','Dicht','',''],['door','Garagepoort','Dicht','',''],['door','Raam','Dicht','',''],['smoke','Rookmelder','Ok','','']];
const row=([ic,n,t,c,sub])=>`<div class="r">${i(ic)}<span class="tt">${n}${sub?`<small>${sub}</small>`:''}</span><span class="st ${c}">${c?`<i class="dot ${c}"></i>`:''}${t}</span></div>`;
const list=(items)=>`<div class="list">${items.map(row).join('')}</div>`;
const line=(dot,text,lit,tap=true)=>`<span class="line ${lit?'lit':''}"><i class="dot ${dot}"></i>${text}${tap?`<svg class="chev" viewBox="0 0 24 24">${P.chev}</svg>`:''}</span>`;
const head=(name,l)=>`<p class="lbl">Kamer</p><div class="hd"><div><h1>${name}</h1>${l}</div><div class="v"><b>19,4°</b><span>58% vochtigheid</span></div></div>`;
const body=`<div class="tabs"><span class="tab on">Verlichting</span><span class="tab">Screens</span></div>
<div class="group"><div class="row"><div class="ic on">${i('bulb')}</div><div class="t"><b>Gang</b><span>Aan</span></div><div class="sw on"></div></div>
<div class="row"><div class="ic">${i('bulb')}</div><div class="t"><b>Buitenlamp</b><span>Uit</span></div><div class="sw"></div></div></div>`;
const navFor=(r)=>`<div class="nav"><div class="pills"><div class="pill">${i('home')}Thuis</div><div class="pill ${r==='Inkom'?'on':''}">${i('door')}Inkom</div><div class="pill ${r==='Bureau'?'on':''}">${i('sofa')}Bureau</div></div></div>`;
const phone=(room,inner,extra='')=>`<div class="phone"><div class="in">${inner}</div>${navFor(room)}${extra}</div>`;
const sheet=(sub,dot,inner)=>`<div class="dim"></div><div class="sheet"><div class="handle"></div><h2>Veiligheid</h2><p class="sub"><i class="dot ${dot}"></i>Inkom · ${sub}</p>${inner}</div>`;
const S=[
 ['Sheet · problemen','Titel "Veiligheid"; eerst wat aandacht vraagt',phone('Inkom',head('Inkom',line('red','3 vragen aandacht',true))+body,sheet('3 vragen aandacht','red',`<p class="sec">Aandacht</p>${list(BAD)}<p class="sec">In orde</p>${list(OKI)}`))],
 ['Sheet · alles ok','Ook dan kun je tikken; vaste volgorde, rustig',phone('Inkom',head('Inkom',line('','Alles in orde',false))+body,sheet('Alles in orde','',list(ALLOK)))],
 ['Regel · één probleem','Altijd tellen: enkelvoud bij 1',phone('Inkom',head('Inkom',line('red','1 vraagt aandacht',true))+body)],
 ['Maar één toestel','Bureau: zelfde regel en zelfde sheet als elke kamer',phone('Bureau',head('Bureau',line('','Alles in orde',false))+body,`<div class="dim"></div><div class="sheet"><div class="handle"></div><h2>Veiligheid</h2><p class="sub"><i class="dot "></i>Bureau · Alles in orde</p>${list([['smoke','Rookmelder','Ok','','']])}</div>`)],
];
document.body.innerHTML=S.map(([c,s,h])=>`<div><p class="cap">${c}<small>${s}</small></p>${h}</div>`).join('');
</script></html>
