<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Room openings</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px}
.panel{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
background:var(--bg);color:var(--text);border-radius:28px;padding:22px 24px 22px;display:flex;flex-direction:column;gap:30px}
.lbl{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{margin:0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:32px}
.hd{display:flex;align-items:baseline;justify-content:space-between}
.v{text-align:right}.v b{display:block;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:32px;line-height:1.15}.v span{font-size:13px;color:var(--muted)}
.state{font-size:13px;color:var(--muted);margin:2px 0 0}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.lit{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.chip.open{color:var(--text)}
.chip .dot{margin:0}
.ex{font-size:11px;color:#6f6d67;text-transform:uppercase;letter-spacing:.06em;margin:0 0 -18px}
</style></head><body></body>
<script>
const lock='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const H=(under)=>`<div><p class="lbl">Kamer</p><div class="hd"><div><h1>Inkom</h1>${under}</div><div class="v"><b>19,8°</b><span>52% vochtigheid</span></div></div></div>`;
const A=[`<p class="ex">Alles dicht</p>`+H(`<p class="state">${lock} Alles gesloten</p>`),`<p class="ex">Iets open</p>`+H(`<p class="state lit"><i class="dot"></i>Achterdeur, garagepoort open</p>`)];
const B=[`<p class="ex">Alles dicht</p>`+H(`<p class="state">${lock} Alles gesloten</p>`),`<p class="ex">Iets open</p>`+H(`<p class="state lit"><i class="dot"></i>2 open</p>`)];
const chips=(open)=>`<div class="chips">${[['Voordeur',false],['Achterdeur',open],['Garage',open],['Raam',false]].map(([n,o])=>`<span class="chip ${o?'open':''}">${o?'<i class="dot"></i>':''}${n}</span>`).join('')}</div>`;
const C=[`<p class="ex">Alles dicht</p>`+H(chips(false)),`<p class="ex">Iets open</p>`+H(chips(true))];
const V=[['A · Eén regel, met namen','Dicht: "Alles gesloten". Open: wat er open is',A],['B · Eén regel, enkel aantal','Nog korter: "2 open"',B],['C · Kleine chips','Elk item een chip, open krijgt een stipje',C]];
document.body.innerHTML=V.map(([t,s,h])=>`<div><p class="cap">${t}<small>${s}</small></p><div class="panel">${h.join('')}</div></div>`).join('');
</script></html>
