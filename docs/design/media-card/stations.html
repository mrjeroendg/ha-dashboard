<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Station colours</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px}
.stage{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);background:var(--bg);color:var(--text);border-radius:28px;padding:16px}
.mp{display:flex;flex-direction:column;gap:10px;box-sizing:border-box;height:122px;padding:12px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.top{display:flex;align-items:center;gap:12px}
.th{flex:none;width:96px;height:54px;border-radius:12px;opacity:.55;background:radial-gradient(circle at 70% 30%,#f2c48d,transparent 45%),radial-gradient(circle at 20% 80%,#3c6e8f,transparent 55%),linear-gradient(135deg,#7b4a3a,#1d2a33)}
.txt b{display:block;font-size:16px;font-weight:600}.txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pills{display:flex;gap:6px}
.pill{flex:1;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 4px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border);font-size:13px;font-weight:600}
.dot{flex:none;width:26px;height:26px;border-radius:50%;filter:brightness(.75) saturate(.85)}
.big{display:flex;gap:18px;justify-content:center;margin-top:16px}
.big .dot{width:56px;height:56px}
.big span{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
</style></head><body></body>
<script>
const dot=(cols)=>`radial-gradient(circle at 38% 32%, color-mix(in srgb, ${cols[0]} 45%, #fff), transparent 55%), linear-gradient(150deg, ${cols.join(', ')})`;
const R1=['#2a8fff','#0068d8','#002a66'];
const R1C=['#ff4942','#0068d8','#002a66'];
const SB1=['#9a45cc','#7e31aa','#331a5c'];
const SB2=['#ff4942','#7e31aa','#331a5c'];
const KL=['#f9e180','#c0b06c','#434540'];
const KLC=['#ff4942','#c0b06c','#434540'];
const now={r1:'radial-gradient(circle at 35% 30%, #f4d7a1, transparent 55%), linear-gradient(160deg, #e28a5c, #7a3b4b)',sb:'radial-gradient(circle at 50% 40%, #f1e3c6, transparent 55%), linear-gradient(135deg, #b9a07a, #5d5246)'};
const card=(r1,sb,kl)=>`<div class="mp"><div class="top"><div class="th"></div><div class="txt"><b>Muziek op Sonos</b><span>Kies een stream om te beginnen</span></div></div>
<div class="pills"><div class="pill"><span class="dot" style="background:${r1}"></span>Radio 1</div><div class="pill"><span class="dot" style="background:${sb}"></span>StuBru</div><div class="pill"><span class="dot" style="background:${kl}"></span>Klara</div></div></div>
<div class="big"><div><span class="dot" style="background:${r1}"></span><span>Radio 1</span></div><div><span class="dot" style="background:${sb}"></span><span>StuBru</span></div><div><span class="dot" style="background:${kl}"></span><span>Klara</span></div></div>`;
const V=[['Nu','Beige en bruin, per positie',card(now.r1,now.sb,"radial-gradient(circle at 40% 35%, #c3b2f0, transparent 55%), linear-gradient(135deg, #7a64c9, #2f2a4f)")],['A · Speler-kleuren','Radio 1 blauw, StuBru paars, Klara goud',card(dot(R1),dot(SB1),dot(KL))],['B · Met koraal-accent','Zelfde, met de koraalrode gloed van de play-knop',card(dot(R1C),dot(SB2),dot(KLC))]];
document.body.innerHTML=V.map(([t,s,h])=>`<div><p class="cap">${t}<small>${s}</small></p><div class="stage">${h}</div></div>`).join('');
</script></html>
