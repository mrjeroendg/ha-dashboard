<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Tappable 2</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:96px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);background:var(--bg);color:var(--text);border-radius:44px 44px 0 0;padding:26px 24px 30px;width:342px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card,.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 16px 10px;margin-bottom:12px}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}
.value{margin:6px 0 0;font-size:26px;font-weight:600}.value small{margin-left:3px;font-size:13px;color:var(--muted);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:7px;height:46px;margin-top:10px}.bars b{flex:1;border-radius:2px;background:#d5518173}.bars b:last-child{background:#d55181}
.qf{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.qf strong{display:block;color:var(--text);font-size:22px;margin-top:2px}.qf .r{text-align:right}
.qbar{height:10px;border-radius:5px;margin:12px 0 6px;background:linear-gradient(90deg,#6bab3e 0 30%,rgba(107,171,62,.25) 30%,rgba(232,145,58,.25) 62%,rgba(180,35,24,.25))}
.left{font-size:12px;color:var(--muted)}
.chev{display:inline-grid;color:var(--muted);opacity:.8}.chev svg{width:14px;height:14px}
.corner{position:absolute;top:12px;right:12px}
.pressed{transform:scale(.98);background:#383835}
.hint{font-size:11px;color:#d97757;margin:-4px 0 12px}
.ring{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px #d97757;margin-left:-3px}
.ring svg{width:14px;height:14px}
.handle{display:block;width:28px;height:4px;border-radius:2px;background:rgba(245,244,239,.18);margin:8px auto -4px}
.stack{position:relative;margin-bottom:20px}.stack:after{content:'';position:absolute;left:14px;right:14px;bottom:-7px;height:14px;border-radius:0 0 16px 16px;background:#2c2c2a;box-shadow:inset 0 0 0 1px rgba(245,244,239,.08);z-index:0}
.stack>.tile,.stack>.card{position:relative;z-index:1;margin-bottom:0}
.dotted{text-decoration:underline dotted rgba(245,244,239,.45);text-underline-offset:3px}
.expand{position:absolute;top:12px;right:12px;color:var(--muted)}.expand svg{width:13px;height:13px}
</style></head><body></body><script>
const chev='<span class="chev"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
const home='<svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>';
const bars='<div class="bars">'+[30,34,28,40,26,33,38,30,29,36,27,35,41,22].map(h=>`<b style="height:${h}px"></b>`).join('')+'</div>';
const tile=(nameExtra='',cornerExtra='',cls='')=>`<div class="tile ${cls}"><p class="name">${home}Huis vandaag${nameExtra}</p>${cornerExtra}<p class="value">10,75<small>kWh</small></p>${bars}</div>`;
const quarter=(labelExtra='',bottomExtra='',cls='')=>`<div class="card ${cls}"><div class="qf"><div>Gemiddeld dit kwartier<strong>1,20 kW</strong></div><div class="r">Piek deze maand${labelExtra}<strong>3,60 kW</strong></div></div><div class="qbar"></div><div class="left" style="display:flex;justify-content:space-between">Nog 6 min${bottomExtra}</div></div>`;
const ringHome=`<span class="ring">${home}</span>`;
const tileIcon=(iconHtml,nameClass='',after='',cls='')=>`<div class="tile ${cls}"><p class="name">${iconHtml}<span class="${nameClass}">Huis vandaag</span></p>${after}<p class="value">10,75<small>kWh</small></p>${bars}</div>`;
const expand='<span class="expand"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span>';
const quarterRing=`<div class="card"><div class="qf"><div><span style="display:inline-flex;align-items:center;gap:6px"><span class="ring" style="margin-left:0"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>Gemiddeld dit kwartier</span><strong>1,20 kW</strong></div><div class="r">Piek deze maand<strong>3,60 kW</strong></div></div><div class="qbar"></div><div class="left">Nog 6 min</div></div>`;
const S=[
 ['D · Het oranje randje van Snel','Wat in Snel al betekent "opent een sheet": een dun oranje randje (1px, de accentkleur) rond het icoontje. Op Energie krijgt het icoontje van elke tegel die opent hetzelfde randje. Eén taal voor het hele dashboard.',tileIcon(ringHome)+quarterRing],
 ['E · Een greepje onderaan','Een klein streepje onderaan de tegel, zoals het handvat bovenaan een sheet: "hier zit meer onder". Optioneel ook omhoog vegen op de tegel om te openen.',tileIcon(home,'','').replace(/<\/div>$/,'<span class="handle"></span></div>')+quarter('').replace('Nog 6 min</div></div>','Nog 6 min</div><span class="handle"></span></div>')],
 ['F · Een kaart erachter','Onder de tegel piept een tweede kaart uit, alsof er een stapel ligt: er zit meer achter. Geen icoon of tekst, alleen diepte.',`<div class="stack">${tileIcon(home)}</div><div class="stack">${quarter('')}</div>`],
 ['G · Een stippellijn onder de naam','De naam krijgt een fijne stippellijn eronder, zoals een woord met uitleg. Rustig, maar minder bekend als "opent iets".',tileIcon(home,'dotted')+quarter('').replace('Piek deze maand','<span class="dotted">Piek deze maand</span>')],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone">${h}</div></div>`).join('');
</script></html>
