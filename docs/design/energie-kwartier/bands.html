<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>K1 met kleuren</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{min-height:76px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--good:#6bab3e;--watch:#e8913a;--bad:#b42318;
position:relative;width:390px;height:300px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 4px 10px}
.card{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:14px 16px}
.row2{display:flex;justify-content:space-between;align-items:baseline}.lbl{font-size:13px;color:var(--muted)}
.mid{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.mid small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:2px}
.meter{position:relative;height:10px;border-radius:5px;margin:14px 0 6px;overflow:visible;
 background:linear-gradient(90deg,color-mix(in srgb,var(--good) 22%,transparent) 0 var(--b4),color-mix(in srgb,var(--watch) 22%,transparent) var(--b4) var(--b6),color-mix(in srgb,var(--bad) 30%,transparent) var(--b6))}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meter .mark{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:1px;background:var(--text)}
.ticks{position:relative;height:14px;font-size:11px;color:var(--muted)}.ticks span{position:absolute;transform:translateX(-50%)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
</style></head><body></body>
<script>
const SCALE=8; // the bar runs to 8 kW, or further when the peak is higher
const band=(kw)=>kw>6?'var(--bad)':kw>4?'var(--watch)':'var(--good)';
const fmt=(kw)=>kw.toLocaleString('nl-BE',{minimumFractionDigits:1,maximumFractionDigits:1});
function k1(quarter,peak,peakWhen,left){
  const top=Math.max(SCALE,peak*1.1),pct=(kw)=>`${(kw/top*100).toFixed(1)}%`;
  return `<div class="sec">Dit kwartier</div><div class="card">
  <div class="row2"><span class="lbl">Gemiddeld dit kwartier</span><span class="lbl">Piek deze maand</span></div>
  <div class="row2"><span class="mid"><span class="dot" style="background:${band(quarter)}"></span>${fmt(quarter)}<small>kW</small></span><span class="mid"><span class="dot" style="background:${band(peak)}"></span>${fmt(peak)}<small>kW</small></span></div>
  <div class="meter" style="--b4:${pct(4)};--b6:${pct(6)}"><span class="fill" style="width:${pct(quarter)};background:${band(quarter)}"></span><span class="mark" style="left:${pct(peak)}"></span></div>
  <div class="ticks"><span style="left:${pct(4)}">4</span><span style="left:${pct(6)}">6 kW</span></div>
  <div class="foot"><span>Nog ${left} min</span><span>${peakWhen}</span></div></div>`;
}
const S=[
 ['Rustig: alles groen','Het lopende kwartier (0,4 kW) en de maandpiek (3,6 kW) zijn allebei onder 4 kW. De balk heeft drie zachte zones: groen tot 4, oranje tot 6, donkerrood erboven.',k1(0.4,3.6,'12 okt · 18:15',9)],
 ['Oven en vaatwas: oranje','Het kwartier zit op 4,6 kW: de balk en het bolletje worden oranje. Het witte streepje (de maandpiek, 3,6 kW) is al voorbij: dit kwartier wordt een nieuwe piek.',k1(4.6,3.6,'12 okt · 18:15',6)],
 ['Een piek om niet te herhalen: donkerrood','De maandpiek staat op 6,8 kW (donkerrood bolletje), van de avond dat de auto laadde terwijl de oven aan stond. Het kwartier van nu is weer groen.',k1(1.1,6.8,'3 nov · 19:30',12)],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
