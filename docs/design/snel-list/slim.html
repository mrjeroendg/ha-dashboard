<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Slim controls</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:36px 28px}
.cap{min-height:58px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
position:relative;width:390px;height:470px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:30px 24px 0}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec{margin:6px 4px 12px;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.list{border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;position:relative}
.row+.row{box-shadow:inset 0 1px 0 var(--border)}
.ic{width:36px;height:36px;border-radius:12px;background:var(--bg);color:var(--accent);display:grid;place-items:center;flex:none}.ic svg{width:20px;height:20px}
.on .ic{background:var(--accent);color:#fff}
.row b{flex:1;font-size:16px;font-weight:500}
.go{height:32px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600}
.go.done{min-width:44px}
.sw{width:48px;height:30px;border-radius:999px;background:var(--accent);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff}
/* S1 · smaller everything */
.s1 .row{gap:12px;padding:8px 14px}
.s1 .ic{width:28px;height:28px;border-radius:9px}.s1 .ic svg{width:16px;height:16px}
.s1 .row b{font-size:15px}
.s1 .go{height:26px;padding:0 12px;font-size:12px}
.s1 .sw{width:40px;height:24px}.s1 .sw::after{top:2px;right:2px;width:20px;height:20px}
/* S2 · bare icon, text action */
.s2 .row{gap:12px;padding:11px 16px}
.s2 .ic{width:20px;height:20px;background:none;color:var(--muted)}.s2 .ic svg{width:20px;height:20px}
.s2 .on .ic{background:none;color:var(--accent)}
.s2 .row b{font-size:15px}
.s2 .go{height:auto;padding:0;background:none;font-size:14px}
.s2 .sw{width:40px;height:24px}.s2 .sw::after{top:2px;right:2px;width:20px;height:20px}
/* S3 · iOS settings: small filled tile, divider starts after the icon */
.s3 .list{border-radius:16px}
.s3 .row{gap:12px;padding:7px 14px}
.s3 .row+.row{box-shadow:none}
.s3 .row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:1px;background:var(--border)}
.s3 .ic{width:28px;height:28px;border-radius:8px;background:var(--soft)}.s3 .ic svg{width:17px;height:17px}
.s3 .row b{font-size:15px;font-weight:400}
.s3 .go{height:26px;padding:0 12px;font-size:12px}
.s3 .sw{width:42px;height:26px}.s3 .sw::after{top:2px;right:2px;width:22px;height:22px}
.meas{position:absolute;left:24px;bottom:22px;font-size:12px;color:var(--muted)}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={baby:svg('<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>'),
garage:svg('<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>'),moon:svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
sofa:svg('<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 11h20v6H2zM5 17v2M19 17v2"/>'),check:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>')};
// Garagedeur shows the feedback after a tap: the checkmark in its Start button, as in the rooms.
const SHORTCUTS=[['baby','Pré slaapje'],['garage','Garagedeur',false,'done'],['moon','Centris',true,'toggle'],['sofa','Sfeer']];
const list=(variant)=>`<div class="${variant}"><div class="list">${SHORTCUTS.map(([icon,label,on,kind])=>`<div class="row${on?' on':''}"><span class="ic">${I[icon]}</span><b>${label}</b>${kind==='toggle'?'<span class="sw"></span>':kind==='done'?`<span class="go done">${I.check.replace('<svg','<svg style="width:15px;height:15px"')}</span>`:'<span class="go">Start</span>'}</div>`).join('')}</div></div>`;
const phone=(variant,height)=>`<div class="phone"><div class="in"><p class="sec">Snel</p>${list(variant)}</div><span class="meas">${height}</span></div>`;
const S=[
 ['C · Zoals goedgekeurd','De rij uit de kamers: icoontegel 36px, schakelaar 48 × 30, "Start" 32px hoog.','regular','Rij 60px · 4 rijen 240px'],
 ['S1 · Alles kleiner','Zelfde opbouw, kleinere maten: tegel 28px, naam 15px, schakelaar 40 × 24, "Start" 26px.','s1','Rij 44px · 4 rijen 176px'],
 ['S2 · Kaal icoon','Geen tegel: enkel het icoon (oranje als iets aan staat). "Start" als tekst zonder pil.','s2','Rij 42px · 4 rijen 172px'],
 ['S3 · Zoals iOS-instellingen','Kleine getinte tegel, scheidingslijn begint na het icoon, normale letter, hoeken 16px.','s3','Rij 42px · 4 rijen 168px'],
];
document.body.innerHTML=S.map(([title,sub,variant,height])=>`<div><p class="cap">${title}<small>${sub}</small></p>${phone(variant,height)}</div>`).join('');
</script></html>
