<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Energie kwartier</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{min-height:110px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;--zon:#c98500;--house:#d97757;--gas:#199e70;--water:#3987e5;--peak:#e8913a;
position:relative;width:390px;height:860px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.card{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 0}
.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lbl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.big{font-size:40px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.gross{display:flex;gap:14px;white-space:nowrap;font-size:13px;color:var(--muted);margin-top:2px}.gross span{display:inline-flex;align-items:center;gap:5px}.gross b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(63,185,80,.14);color:#7fd18b;font-size:12px;font-weight:600}.badge i{width:6px;height:6px;border-radius:50%;background:#3fb950}
.graph{display:block;width:100%;height:64px;margin-top:8px}
.axis{display:flex;justify-content:space-between;padding:2px 16px 10px;font-size:11px;color:var(--muted)}
/* kwartier K1 */
.pad{padding:14px 16px}
.row2{display:flex;justify-content:space-between;align-items:baseline}
.mid{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.mid small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.meter{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.3);margin:12px 0 6px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--from)}
.meter .mark{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:1px;background:var(--text)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* K2 ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ringtext b{display:block;font-size:22px;font-weight:600}.ringtext small{font-size:13px;color:var(--muted)}
/* K3 quarters */
.quarters{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:12px;position:relative}
.quarters span{flex:1;border-radius:3px 3px 0 0;background:rgba(213,81,129,.55)}.quarters span.now{background:var(--from)}
.quarters .peakline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--peak)}
.quarters .peaklbl{position:absolute;right:0;font-size:11px;color:var(--peak);transform:translateY(-120%)}
/* vandaag C */
.balance{padding:14px 16px}.balance .split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 8px}
.balance .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.balance .legend b{color:var(--text);font-weight:600}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),home:svg('<path d="M4 11l8-7 8 7v9H4z"/>')};
const HOUR=[310,280,260,180,90,-40,-180,-320,-420,-610,-780,-850];
function bars(values){const W=342,H=64,top=Math.max(0,...values),bottom=Math.min(0,...values);const y=(v)=>4+(top-v)/(top-bottom)*(H-8),zero=y(0),slot=W/values.length,width=slot*.62;
 return `<svg class="graph" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="rgba(245,244,239,.16)"/>${values.map((v,i)=>{const yy=y(v);return `<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${Math.min(yy,zero).toFixed(1)}" width="${width.toFixed(1)}" height="${Math.max(1.5,Math.abs(yy-zero)).toFixed(1)}" rx="2" fill="${v<0?'#6bab3e':'#d55181'}"/>`}).join('')}</svg>`;}
const nu=`<div class="kicker">Categorie</div><h1>Energie</h1><div class="sec">Nu</div>
 <div class="card" style="--c:#6bab3e"><div class="top"><div><span class="lbl"><i></i>Terug naar het net</span><div class="big">850<small>W</small></div>
 <div class="gross"><span><span style="color:var(--house);display:grid">${I.home}</span>Verbruik <b>1.290 W</b></span><span><span style="color:var(--zon);display:grid">${I.sun}</span>Zon <b>2.140 W</b></span></div></div>
 <span class="badge"><i></i>Live</span></div>${bars(HOUR)}<div class="axis"><span>1 uur geleden</span><span>nu</span></div></div>`;
const vandaag=`<div class="sec">Vandaag tot nu</div><div class="card balance"><div class="lbl" style="--c:transparent">Stroom</div>
 <div class="split"><span style="flex:4.82;background:var(--from)"></span><span style="flex:6.10;background:var(--back)"></span></div>
 <div class="legend"><span>Afgenomen <b>4,82 kWh</b></span><span>Terug <b>6,10 kWh</b></span></div></div>`;
const K1=`<div class="sec">Dit kwartier</div><div class="card pad">
 <div class="row2"><span class="lbl" style="--c:transparent">Gemiddeld dit kwartier</span><span class="lbl" style="--c:transparent">Piek deze maand</span></div>
 <div class="row2"><span class="mid">0,4<small>kW</small></span><span class="mid">3,6<small>kW</small></span></div>
 <div class="meter"><span class="fill" style="width:11%"></span><span class="mark" style="left:72%"></span></div>
 <div class="foot"><span>Nog 9 min</span><span>12 okt · 18:15</span></div></div>`;
const ring=(share)=>{const r=30,c=2*Math.PI*r;return `<svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="#d55181" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*share).toFixed(1)} ${c}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" fill="#f5f4ef" font-size="14" font-weight="600">${Math.round(share*100)}%</text></svg>`;};
const K2=`<div class="sec">Dit kwartier</div><div class="card pad"><div class="ringwrap">${ring(0.11)}<div class="ringtext"><b>0,4 kW <small>van 3,6 kW</small></b><small>Dit kwartier · piek deze maand op 12 okt, 18:15</small><br><small>Nog 9 min</small></div></div></div>`;
const QUARTERS=[1.2,0.8,0.6,2.1,0.5,0.4,0.3,0.4];
const K3=`<div class="sec">Dit kwartier</div><div class="card pad">
 <div class="row2"><span class="mid">0,4<small>kW</small></span><span class="lbl" style="--c:transparent">Piek deze maand <b style="color:var(--peak);margin-left:4px">3,6 kW</b></span></div>
 <div class="quarters">${QUARTERS.map((v,i)=>`<span class="${i===QUARTERS.length-1?'now':''}" style="height:${v/3.6*100}%"></span>`).join('')}<div class="peakline" style="bottom:100%"></div></div>
 <div class="foot" style="margin-top:6px"><span>2 uur geleden</span><span>dit kwartier · nog 9 min</span></div></div>`;
const S=[
 ['K1 · Een balk met de maandpiek','Onder de Nu-kaart: het gemiddelde van het lopende kwartier, en de piek van deze maand als wit streepje op de balk. Komt de balk bij het streepje, dan zet je een nieuwe piek. In de Nu-kaart staat nu ook Verbruik en Zon op een klein regeltje.',nu+K1+vandaag],
 ['K2 · Een ring in procenten','Het lopende kwartier als deel van de maandpiek: 11% betekent nog veel ruimte. Leest het snelst, maar zegt minder over het echte getal.',nu+K2+vandaag],
 ['K3 · De laatste kwartieren als staafjes','De laatste 8 kwartieren (2 uur), met de maandpiek als oranje stippellijn erboven. Je ziet wanneer je er dichtbij kwam. Het lopende kwartier is feller.',nu+K3+vandaag],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
