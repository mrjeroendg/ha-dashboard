<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Gas volle pagina</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:390px 420px;gap:36px;align-items:start}
.notes{font-size:14px;color:#3d3c38;line-height:1.45}.notes h2{font-size:16px;margin:0 0 8px}.notes p{margin:0 0 12px}.notes b{font-weight:600}.notes .need{color:#b4561d}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--gas:#5cb8f2;--last:#a6a39b;
position:relative;width:390px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12);padding-bottom:30px}
.in{padding:26px 24px 0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 18px;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 16px 10px}
.tile+.tile{margin-top:10px}
.num{position:absolute;top:10px;right:12px;width:18px;height:18px;border-radius:50%;background:#d97757;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.name span{display:grid;color:var(--gas)}
.values{display:flex;justify-content:space-between;align-items:baseline}
.value{margin:6px 0 0;font-size:26px;font-weight:600}.value small{margin-left:3px;font-size:13px;font-weight:500;color:var(--muted)}
.price{font-size:15px;font-weight:600}.price small{font-size:12px;font-weight:500;color:var(--muted);margin-right:3px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}.sub b{color:var(--text);font-weight:600}.good{color:#8fca6a!important}
svg.chart{display:block;width:100%;margin-top:10px}
.axis{display:grid;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}.axis span.now{color:var(--text);font-weight:700}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .tile{margin-top:0}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={flame:svg('<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>'),clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),calendar:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),thermo:svg('<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>'),year:svg('<path d="M4 20V10M9 20V6M14 20v-8M19 20V4"/>')};
const fmt=(v,d=2)=>v.toLocaleString('nl-BE',{minimumFractionDigits:d,maximumFractionDigits:d});
const W=342;
function bars(values,{H=64,color='#5cb8f2',highlightLast=true,avgLine}={}){const top=Math.max(...values.filter(v=>v!=null))*1.15,slot=W/values.length,width=slot*.62,y=(v)=>H-(v/top)*H;
 let out=values.map((v,i)=>v==null?'':`<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="2" fill="${color}" opacity="${highlightLast&&i===values.length-1?1:.45}" stroke="none"/>`).join('');
 if(avgLine!==undefined){out+=`<line x1="0" x2="${W}" y1="${y(avgLine)}" y2="${y(avgLine)}" stroke="#f5f4ef" stroke-dasharray="3 3" opacity=".7"/><rect x="0" y="${y(avgLine)-16}" width="58" height="14" rx="4" fill="#262624" stroke="none"/><text x="5" y="${y(avgLine)-6}" font-size="10" fill="#f5f4ef" stroke="none">gem. ${fmt(avgLine)}</text>`;}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${out}</svg>`;}
function pairs(thisYear,lastYear,H=70){const top=Math.max(...thisYear.filter(v=>v!=null),...lastYear)*1.1,slot=W/12,width=slot*0.34,y=(v)=>H-(v/top)*H;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${lastYear.map((v,i)=>`<rect x="${(i*slot+slot*0.12).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="1.5" fill="#a6a39b" opacity=".35" stroke="none"/>`).join('')}${thisYear.map((v,i)=>v==null?'':`<rect x="${(i*slot+slot*0.12+width+1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="1.5" fill="#5cb8f2" opacity="${i===10?1:.7}" stroke="none"/>`).join('')}</svg>`;}
const axis=(labels,nowIndex)=>`<div class="axis" style="grid-template-columns:repeat(${labels.length},1fr)">${labels.map((l,i)=>`<span class="${i===nowIndex?'now':''}">${l}</span>`).join('')}</div>`;
const GAS14=[2.41,2.9,3.1,2.2,2.6,3.4,2.8,2.5,3.6,4.1,3.3,2.9,3.0,1.84];
const DAYS=['D','V','Z','Z','M','D','W','D','V','Z','Z','M','D','W'];
// per hour today 0..23, until 15h
const HOURS=[0.02,0.01,0.01,0.01,0.02,0.18,0.42,0.31,0.12,0.06,0.05,0.04,0.05,0.07,0.09,0.11,null,null,null,null,null,null,null,null];
const THIS_YEAR=[78,64,41,22,9,4,3,3,6,24,52,null];
const LAST_YEAR=[84,71,52,28,11,4,3,3,8,29,58,79];
const MONTHS=['J','F','M','A','M','J','J','A','S','O','N','D'];
const tile1=`<div class="tile"><span class="num">1</span><p class="name"><span>${I.flame}</span>Gas vandaag</p><div class="values"><p class="value">1,84<small>m³</small></p><span class="price"><small>≈</small>€ 2,02</span></div>${bars(GAS14,{avgLine:2.99})}${axis(DAYS,13)}</div>`;
const tile2=`<div class="tile"><span class="num">2</span><p class="name"><span>${I.clock}</span>Per uur vandaag</p>${bars(HOURS.map(v=>v),{H:54,highlightLast:false})}${axis(['0u','','','','','','6u','','','','','','12u','','','','','','18u','','','','','23u'],-1)}<div class="sub">Het meest om <b>6u</b>: 0,42 m³ · de verwarming sprong aan</div></div>`;
const tile3=`<div class="two"><div class="tile"><span class="num">3</span><p class="name"><span>${I.calendar}</span>Deze maand</p><p class="value">5,24<small>m³</small></p><div class="sub"><b class="good">↓ 9%</b> tegenover vorig jaar</div></div><div class="tile"><span class="num">4</span><p class="name"><span>${I.thermo}</span>Per graaddag</p><p class="value">0,31<small>m³</small></p><div class="sub">Gisteren 6,4 °C gemiddeld</div></div></div>`;
const tile5=`<div class="tile" style="margin-top:10px"><span class="num">5</span><p class="name"><span>${I.year}</span>Dit jaar per maand</p><div class="values"><p class="value">306<small>m³</small></p><span class="price" style="font-size:13px"><b class="good" style="color:#8fca6a">↓ 11%</b> <small style="margin:0">tov vorig jaar</small></span></div>${pairs(THIS_YEAR,LAST_YEAR)}${axis(MONTHS,10)}<div class="legend"><span><i style="background:#5cb8f2"></i>Dit jaar</span><span><i style="background:#a6a39b;opacity:.5"></i>Vorig jaar</span><span>≈ 3.210 kWh · ≈ € 337</span></div></div>`;
const phone=`<div class="phone"><div class="in"><div class="kicker">Categorie</div><h1>Gas</h1>${tile1}<div style="height:10px"></div>${tile2}${tile3}${tile5}</div></div>`;
const notes=`<div class="notes"><h2>Een volle Gas-pagina</h2>
<p><b>1 · Gas vandaag</b> — de dagtegel zoals bij Stroom: vandaag in m³, ≈ €, de 14 dagen met hun gemiddelde.</p>
<p><b>2 · Per uur vandaag</b> — wanneer de verwarming brandt: één staafje per uur. Met het drukste uur eronder. Uit HA's uurstatistieken van dezelfde sensor (als je gasmeter per uur of vaker meldt).</p>
<p><b>3 · Deze maand</b> — wat de maand tot nu verbruikte, tegenover <i>dezelfde maand vorig jaar</i>: bij gas zegt vorige maand weinig, want het seizoen verschilt.</p>
<p><b>4 · Per graaddag</b> — hoeveel gas per "koude graad": het verbruik gedeeld door hoe koud het was. Zo zie je of je zuiniger stookt, los van het weer. <span class="need">Vraagt een buitentemperatuur-sensor in HA</span> (die van je weerintegratie kan volstaan).</p>
<p><b>5 · Dit jaar per maand</b> — elke maand naast dezelfde maand vorig jaar (grijs), met het jaartotaal, in kWh en ≈ €. Toont het hele stookseizoen in één oog. <span class="need">Vraagt een jaar aan statistieken in HA</span>; die worden standaard bewaard.</p>
<p>Alles in lichtblauw. De nummers in de hoeken staan alleen in dit ontwerp, om erover te praten.</p></div>`;
document.body.innerHTML=phone+notes;
</script></html>
