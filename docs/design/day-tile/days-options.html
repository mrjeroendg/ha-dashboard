<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Dagtegels 14 dagen</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px}
.cap{min-height:110px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;
position:relative;width:390px;height:560px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 16px 12px;overflow:hidden}
.tile+.tile{margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.name span{display:grid;color:var(--c)}
.value{margin:6px 0 0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.value small{margin-left:3px;font-size:13px;font-weight:500;color:var(--muted)}
.extra{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}.extra b{color:var(--text)}
.progress{height:6px;border-radius:3px;background:rgba(0,0,0,.3);margin-top:10px;position:relative}.progress i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}.progress b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.under{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}.under b{color:var(--text)}
svg.chart{display:block;width:100%;margin-top:10px}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={pylon:svg('<path d="M8 21l4-18 4 18M6 8h12M7 13h10M9.5 21l5-8M14.5 21l-5-8"/>'),sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')};
// 13 full days, then today so far
const TAKEN=[7.9,8.8,10.2,6.4,9.1,11.3,9.4,8.1,7.2,9.9,10.6,8.4,9.0,4.82];
const BACK=[3.1,4.6,1.2,0.8,2.9,5.1,6.4,4.2,2.2,0.6,1.8,3.9,5.0,6.10];
const avgOf=(values)=>values.slice(0,-1).slice(-7).reduce((sum,v)=>sum+v,0)/7;
const fmt=(v)=>v.toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
function barChart(values,color,{height=56,avgLine=false}={}){
  const W=326,top=Math.max(...values)*1.1,slot=W/values.length,width=slot*0.62,avg=avgOf(values);
  const y=(v)=>height-(v/top)*height;
  const rects=values.map((v,i)=>{const isToday=i===values.length-1;return `<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(height-y(v)).toFixed(1)}" rx="2" fill="${color}" opacity="${isToday?1:.45}" stroke="none"/>`}).join('');
  const line=avgLine?`<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f5f4ef" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${height}" height="${height}">${rects}${line}</svg><div class="axis"><span>14 dagen geleden</span><span>vandaag</span></div>`;
}
function lineChart(values,color){
  const W=358,H=46,top=Math.max(...values)*1.15,step=W/(values.length-1);
  const pts=values.map((v,i)=>[i*step,H-(v/top)*H]);
  const d=pts.map(([x,yy],i)=>(i?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="none" style="margin:10px -16px -12px;width:calc(100% + 32px)"><defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity=".04"/></linearGradient></defs><path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#g${color.slice(1)})" stroke="none"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${pts.at(-1)[0]-3}" cy="${pts.at(-1)[1]}" r="3.5" fill="${color}" stroke="none"/></svg>`;
}
const head=(taken)=>`<p class="name"><span>${taken?I.pylon:I.sun}</span>${taken?'Afgenomen vandaag':'Teruggeleverd vandaag'}</p>`;
const color=(taken)=>taken?'#d55181':'#6bab3e';
// D1: everything of the day tile, plus 14 bars
const D1tile=(taken)=>{const values=taken?TAKEN:BACK,avg=avgOf(values),today=values.at(-1);return `<div class="tile" style="--c:${color(taken)}">${head(taken)}<div class="top"><p class="value">${fmt(today)}<small>kWh</small></p><span class="extra">Gem. ${fmt(avg)} · ≈ <b>€ ${fmt(today*(taken?0.35:0.04))}</b></span></div>
 <div class="progress"><i style="width:${Math.min(100,today/(Math.max(today,avg)*1.25)*100)}%"></i><b style="left:${avg/(Math.max(today,avg)*1.25)*100}%"></b></div>${barChart(values,color(taken))}</div>`;};
// D2: the 14 bars replace the bar; the average as a dashed line through them
const D2tile=(taken)=>{const values=taken?TAKEN:BACK,avg=avgOf(values),today=values.at(-1);return `<div class="tile" style="--c:${color(taken)}">${head(taken)}<div class="top"><p class="value">${fmt(today)}<small>kWh</small></p><span class="extra">Gem. ${fmt(avg)} · ≈ <b>€ ${fmt(today*(taken?0.35:0.04))}</b></span></div>${barChart(values,color(taken),{height:64,avgLine:true})}</div>`;};
// D3: a line of 14 days along the bottom, like the Thuis tiles
const D3tile=(taken)=>{const values=taken?TAKEN:BACK,avg=avgOf(values),today=values.at(-1);return `<div class="tile" style="--c:${color(taken)}">${head(taken)}<div class="top"><p class="value">${fmt(today)}<small>kWh</small></p><span class="extra">Gem. ${fmt(avg)} · ≈ <b>€ ${fmt(today*(taken?0.35:0.04))}</b></span></div>
 <div class="progress"><i style="width:${Math.min(100,today/(Math.max(today,avg)*1.25)*100)}%"></i><b style="left:${avg/(Math.max(today,avg)*1.25)*100}%"></b></div>${lineChart(values,color(taken))}</div>`;};
const page=(tile)=>tile(true)+tile(false);
const S=[
 ['D1 · Alles van nu, plus 14 staafjes','De tegel zoals nu, maar over de volle breedte: het getal links, "Gem. · ≈ €" rechts, de balk tegenover je gemiddelde, en daaronder 14 staafjes, één per dag. Vandaag (nog bezig) is feller.',page(D1tile)],
 ['D2 · De staafjes vervangen de balk','Geen aparte balk meer: het gemiddelde is een stippellijn door de 14 staafjes. Je ziet in één grafiek of vandaag boven of onder een gewone dag zit, en hoe de vorige dagen waren.',page(D2tile)],
 ['D3 · Een lijn langs de onderkant','De balk blijft, en de 14 dagen lopen als lijn met zachte vulling langs de onderkant van de tegel, zoals de Verbruik-tegels op Thuis. Het bolletje is vandaag.',page(D3tile)],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
