<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Banner depth</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,420px);gap:28px}
.cap{font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px}
.panel{background:#262624;border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;
--surface:#30302e;--text:#f5f4ef;color:var(--text)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b{--c:#e5534b;--sub:#f0b3ae;--tint:16%;--edge:45%;--on:#fff;position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;overflow:hidden}
.b.high{--c:#b42318;--sub:#f2a49c;--tint:30%;--edge:85%}
.b.low{--c:#e8913a;--sub:#f3c99a;--tint:13%;--edge:40%;--on:#2b1a0a}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--c);color:var(--on);position:relative;z-index:1}
.t{position:relative;z-index:1;min-width:0}.t b{display:block;font-size:15px;font-weight:600}.t span{display:block;font-size:13px;color:var(--sub);margin-top:1px}

/* Base: the colour spans the whole card, --t is the tint strength per level. */
.b{--t:26%}.b.high{--t:42%}.b.low{--t:20%}
.b{--base:color-mix(in srgb,var(--c) var(--t),var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) var(--edge),transparent)}

/* A · even tint, lit from above */
.vA .b{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.14)),var(--base);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px color-mix(in srgb,var(--c) calc(var(--edge)*.7),transparent),0 6px 16px -6px rgba(0,0,0,.6)}

/* B · diagonal: deep at the icon, brighter towards the top right */
.vB .b{background:linear-gradient(120deg,color-mix(in srgb,var(--c) calc(var(--t)*1.05),#1f1f1d),color-mix(in srgb,var(--c) calc(var(--t)*1.25),#4a4a46));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px color-mix(in srgb,var(--c) calc(var(--edge)*.7),transparent),0 6px 16px -6px rgba(0,0,0,.6)}

/* C · light from the top right: a soft spotlight on the empty side */
.vC .b{background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--c) calc(var(--t)*1.5),#55554f),transparent 60%),var(--base);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px color-mix(in srgb,var(--c) calc(var(--edge)*.7),transparent),0 6px 16px -6px rgba(0,0,0,.6)}

/* D · two light sources: one behind the icon, one on the right */
.vD .b{background:
  radial-gradient(80px 60px at 30px 50%,color-mix(in srgb,var(--c) 45%,transparent),transparent 75%),
  radial-gradient(70% 120% at 95% 20%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),
  var(--base);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px color-mix(in srgb,var(--c) calc(var(--edge)*.7),transparent),0 8px 20px -10px var(--c)}

/* E · full colour, lit from above (white text everywhere) */
.vE .b{--sub:rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.12)),color-mix(in srgb,var(--c) 78%,#262624);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -6px rgba(0,0,0,.6)}
.vE .ic{background:rgba(255,255,255,.18);color:#fff}
.vE .b.low{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.12)),color-mix(in srgb,var(--c) 62%,#262624)}

/* 0 · current */
.v0 .b{background:linear-gradient(90deg,color-mix(in srgb,var(--c) calc(var(--tint)*2.2),var(--surface)),color-mix(in srgb,var(--c) 4%,var(--surface)))}

/* raised icon tile for all */
.vA .ic,.vB .ic,.vC .ic,.vD .ic{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 85%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.35)}
</style></head><body></body>
<script>
const P={garage:'<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>',window:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M4 12h16"/>',upd:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5M12 8v5l3 2"/>'};
const i=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const b=(lvl,ic,t,s)=>`<div class="b ${lvl}"><div class="ic">${i(ic)}</div><div class="t"><b>${t}</b><span>${s}</span></div></div>`;
const set=b('high','garage','Garagepoort staat open','Al 25 min · 22:04')+b('','window','Raam badkamer open','Al 40 min · 21:49')+b('low','upd','Immich update beschikbaar','v3.3.1 → v3.3.5');
const V=[['v0','Nu','Rechts wordt het bijna zwart'],['vA','A · Gelijkmatig, licht van boven','Kleur over de hele kaart'],['vB','B · Diagonaal','Diep bij het icoon, lichter rechtsboven'],['vC','C · Spot rechtsboven','Zacht licht op de lege kant'],['vD','D · Twee lichtbronnen','Gloed bij het icoon én rechts'],['vE','E · Volle kleur','Stevig gekleurd, witte tekst']];
document.body.innerHTML=V.map(([c,t,s])=>`<div><p class="cap">${t}<small>${s}</small></p><div class="panel ${c}">${set}</div></div>`).join('');
</script></html>
