<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Sheet name ideas</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(2,390px);gap:28px}
.cap{min-height:44px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px;line-height:1.35}
.sheet{--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
border-radius:28px 28px 0 0;background:#2b2b29;color:var(--text);padding:10px 20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.handle{width:36px;height:5px;border-radius:3px;background:rgba(245,244,239,.18);margin:0 auto 8px}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:10px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(245,244,239,.22)}.dots i.on{width:16px;background:var(--text)}
h2{margin:4px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:24px}
.eyebrow{margin:6px 0 0;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow+h2{margin-top:4px}
.dotname{font-size:12px;color:var(--muted);margin-right:6px}
h2 .muted{color:var(--muted)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}.hdr h2{margin:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:13px;color:var(--muted)}
.chip .ic{width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}.chip .ic svg{width:14px;height:14px}
.pills{display:flex;gap:6px;margin-top:12px}.pill{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.pill.on{background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}.pill.off{opacity:.35;background:transparent}
</style></head><body></body>
<script>
const bulb='<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
const dots=`<div class="dots"><i></i><i class="on"></i><i></i></div>`;
const pills=`<div class="pills"><span class="pill off">Ring</span><span class="pill on">Lamp</span></div>`;
const sheet=(top)=>`<div class="sheet"><div class="handle"></div>${top}${pills}</div>`;
const S=[
 ['A · Label boven de titel','Zoals "KAMER" boven de kamernaam op de kamerpagina.',sheet(dots+`<p class="eyebrow">Verlichting</p><h2>Warmte</h2>`)],
 ['B · Naast de stipjes','Klein en gecentreerd bovenaan, uit de weg.',sheet(`<div class="dots"><span class="dotname">Verlichting</span><i></i><i class="on"></i><i></i></div><h2>Warmte</h2>`)],
 ['C · Eén regel, naam gedempt','"Verlichting Warmte": de naam grijs, de pagina wit.',sheet(dots+`<h2><span class="muted">Verlichting</span> Warmte</h2>`)],
 ['D · Chip met het icoon','Hetzelfde oranje icoon als de rij waarop je tikte, rechts van de titel.',sheet(dots+`<div class="hdr"><h2>Warmte</h2><span class="chip"><span class="ic">${bulb}</span>Verlichting</span></div>`)],
];
document.body.innerHTML=S.map(([c,s,h])=>`<div><p class="cap">${c}<small>${s}</small></p>${h}</div>`).join('');
</script></html>
