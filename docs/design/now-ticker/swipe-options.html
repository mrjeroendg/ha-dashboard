<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Nu-ticker</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:74px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);--water:#6cb8e6;
position:relative;width:390px;height:470px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg))}
.in{padding:28px 24px 0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.date{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daterow{display:flex;align-items:center;justify-content:space-between;height:16px}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:31px}
.status{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 16px;font-size:15px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:22px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.status b{font-weight:400;color:var(--water)}
.warn{margin-top:16px;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,#b42318 42%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,#b42318 60%,transparent)}
.warn .wi{width:34px;height:34px;border-radius:10px;background:#b42318;display:grid;place-items:center;color:#fff}.warn b{display:block;font-size:15px}.warn span{font-size:13px;color:#f2a49c}
.sec{margin:26px 4px 10px;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.list{border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;padding:10px 14px}.lrow+.lrow{box-shadow:inset 0 1px 0 var(--border)}
.lic{width:32px;height:32px;border-radius:10px;background:var(--bg);color:var(--accent);display:grid;place-items:center}.lic svg{width:18px;height:18px}
.lrow b{flex:1;font-size:15px;font-weight:500}.go{padding:6px 13px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:600}
/* the cat */
.cat{color:var(--water)}
.drops{display:inline-flex;gap:2px;margin-left:2px}.drops i{width:4px;height:6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--water);opacity:.9}
.drops i:nth-child(2){opacity:.6}.drops i:nth-child(3){opacity:.3}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 7px;border-radius:999px;background:color-mix(in srgb,var(--water) 14%,var(--surface));color:var(--water);font-size:12px;font-weight:600}
.chip svg{width:15px;height:15px}
.sub{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}.sub svg{width:16px;height:16px;color:var(--water)}
.bowl{position:absolute;right:28px;top:96px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--water)}
.bowl svg{width:30px;height:30px}
.bowl small{font-size:10px;font-weight:600;letter-spacing:.04em}
.ripple{width:22px;height:4px;border-radius:50%;border:1.5px solid var(--water);opacity:.5}

.ticker{position:relative;overflow:hidden;margin-top:10px;-webkit-mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.belt{display:flex;width:max-content;animation:crawl 26s linear infinite}
.belt span.item{display:inline-flex;align-items:center;gap:7px;padding-right:22px;font-size:14px;color:var(--muted);white-space:nowrap}
.belt span.item svg{width:16px;height:16px}
.belt span.item b{font-weight:400;color:var(--text)}
.belt span.item::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5;margin-left:15px}
@keyframes crawl{to{transform:translateX(-50%)}}
.news{display:flex;align-items:center;gap:0;margin-top:12px;height:30px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.news .label{flex:none;align-self:stretch;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em}
.news .label i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.news .ticker{flex:1;margin:0}
.news .belt span.item{font-size:13px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
.navbox{border-radius:26px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.navbox .t{padding:7px 4px 6px;box-shadow:inset 0 -1px 0 var(--border)}.navbox .t .ticker{margin:0}
.navbox .t .belt span.item{font-size:12px}
.tabs{display:flex;justify-content:space-around;padding:10px 6px 8px}.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}.tabs svg{width:20px;height:20px}.tabs .on{color:var(--accent)}
.phone.tall{height:520px;border-radius:0 0 44px 44px}.phone.tall::after{display:none}

.pillticker{display:flex;align-items:center;gap:10px;margin-top:16px;height:46px;padding:0 0 0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.pillticker>i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.pillticker .ticker{flex:1;margin:0}
.pillticker .chev{flex:none;padding:0 14px 0 4px;color:var(--muted);display:grid}.pillticker .chev svg{width:14px;height:14px}
.fixed{flex:none;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text);padding-right:4px}
.fixed i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.belt span.item.st span:first-child{color:var(--muted)!important}

.still .belt{animation:none!important}.still .belt span.item{padding-right:12px}.still .belt span.item::after{margin-left:9px}
.peek .ticker{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent)}
.chiprow{display:flex;gap:6px;margin-top:16px;overflow:hidden;margin-right:-24px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.schip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--muted);white-space:nowrap}
.schip svg{width:16px;height:16px}.schip b{font-weight:400;color:var(--text)}
.more{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;padding:0 12px 0 28px;background:linear-gradient(to right,transparent,var(--surface) 40%);color:var(--muted);font-size:13px;gap:2px}
.more svg{width:14px;height:14px}
.pillticker.rel{position:relative}
.bar{height:3px;border-radius:2px;background:var(--border);margin:6px 18px 0;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;background:color-mix(in srgb,var(--text) 35%,transparent)}

.inbar{position:absolute;height:2px;border-radius:1px}
.inbar i{position:absolute;top:0;bottom:0;border-radius:1px;background:color-mix(in srgb,var(--text) 38%,transparent)}
.inbar.d1{left:16px;right:16px;bottom:6px;background:var(--border)}.inbar.d1 i{left:0;width:38%}
.inbar.d2{left:22px;right:22px;bottom:0;height:2px}.inbar.d2 i{left:0;width:38%;background:color-mix(in srgb,var(--text) 45%,transparent)}
.inbar.d3{left:50%;width:44px;margin-left:-22px;bottom:5px;background:var(--border)}.inbar.d3 i{left:0;width:16px}
.pillticker.rel{position:relative;overflow:hidden}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={
 cat:svg('<path d="M5 9L4 4l4 3h8l4-3-1 5v4a7 7 0 0 1-14 0z"/><path d="M9.5 12.5h.01M14.5 12.5h.01M11 15.5l1 .8 1-.8"/>'),
 drop:svg('<path d="M12 3.5c3 4 5.5 6.8 5.5 9.8a5.5 5.5 0 0 1-11 0c0-3 2.5-5.8 5.5-9.8z"/>'),
 garage:svg('<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>'),
 baby:svg('<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>'),
};
const drops='<span class="drops"><i></i><i></i><i></i></span>';
const rest=`<div class="warn"><span class="wi">${I.garage}</span><div><b>Garagepoort staat open</b><span>Sinds 20:59</span></div></div>
 <p class="sec">Snel</p><div class="list"><div class="lrow"><span class="lic">${I.baby}</span><b>Pré slaapje</b><span class="go">Start</span></div><div class="lrow"><span class="lic">${I.garage}</span><b>Garagedeur</b><span class="go">Start</span></div></div>`;
const head=({dateExtra='',afterGreeting='',status='Je bent thuis · 2 lichten aan · 1 airco aan',over=''}={})=>`<div class="phone"><div class="in">
 <div class="daterow"><span class="date">Dinsdag 27 oktober</span>${dateExtra}</div><h1>Goedenavond, Jeroen</h1>${afterGreeting}
 <div class="status"><i></i><span>${status}</span></div>${rest}</div>${over}</div>`;
I.mower=svg('<path d="M3 15h14l2-5h-6l-2 5M13 10l2-4"/><circle cx="7" cy="17.5" r="2"/><circle cx="16" cy="17.5" r="2"/>');
I.sun=svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
I.moon=svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>');
I.bin=svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>');
I.home=svg('<path d="M4 11l8-7 8 7v9H4z"/>');I.sofa=svg('<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 11h20v6H2zM5 17v2M19 17v2"/>');I.sprout=svg('<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/>');
I.bulb=svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>');
I.snow=svg('<path d="M12 2v20M4.9 7l14.2 10M4.9 17L19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/>');
I.door=svg('<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01"/>');
I.chev=svg('<path d="M9 6l6 6-6 6"/>');
const STATUS=[[I.bulb,'2 lichten aan'],[I.snow,'1 airco aan'],[I.door,'1 deur of raam open']];
const NOW=[[I.cat,'#6cb8e6','<b>Cara</b> is aan het drinken'],[I.mower,'#7fc46a','<b>Jaqueline</b> maait de voortuin'],[I.sun,'#e3a73a','<b>Goed moment voor de was</b> · 2,1 kW over']];
const st=([icon,text])=>`<span class="item st"><span style="display:grid">${icon}</span><span>${text}</span></span>`;
const nw=([icon,color,text])=>`<span class="item"><span style="color:${color};display:grid">${icon}</span><span>${text}</span></span>`;
const belt=(withPresence)=>(withPresence?`<span class="item"><span style="display:grid;color:var(--accent)">${I.home}</span><span><b>Iedereen thuis</b></span></span>`:'')+STATUS.map(st).join('')+NOW.map(nw).join('');
// Twice the same items, so the belt loops without a seam.
const tick=(withPresence,delay)=>`<div class="ticker"><div class="belt" style="animation-delay:-${delay}s;animation-duration:34s">${belt(withPresence)}${belt(withPresence)}</div></div>`;
const noStatus=(html)=>html.replace(/<div class="status">[\s\S]*?<\/span><\/div>/,'');
const ALL=[[I.home,'var(--accent)','<b>Iedereen thuis</b>'],[I.bulb,null,'2 lichten aan'],[I.snow,null,'1 airco aan'],[I.door,null,'1 deur of raam open'],[I.cat,'#6cb8e6','<b>Cara</b> is aan het drinken']];
const icon=(svgEl,color)=>`<span style="display:grid;color:${color||'var(--muted)'}">${svgEl}</span>`;
const stillTicker=`<div class="ticker still"><div class="belt">${ALL.map(([i,c,t])=>`<span class="item">${icon(i,c)}<span>${t}</span></span>`).join('')}</div></div>`;
const pillWithBar=(cls)=>`<div class="pillticker peek rel" style="padding:0 0 0 16px">${stillTicker}<span class="inbar ${cls}"><i></i></span></div>`;
const D=noStatus(head({afterGreeting:`<div class="pillticker peek" style="padding:0 0 0 16px">${stillTicker}</div><div class="bar"><i></i></div>`}));
const S=[
 ['D · Zoals gekozen','Het balkje los onder de pil.',D],
 ['D1 · Balkje in de pil','Een dun balkje onderaan in de pil, zoals de voortgangslijn van de mini-speler. Toont hoe ver je bent.',noStatus(head({afterGreeting:pillWithBar('d1')}))],
 ['D2 · Op de rand van de pil','Geen apart spoor: een lichter stukje van de onderrand zelf schuift mee. Het meest ingetogen.',noStatus(head({afterGreeting:pillWithBar('d2')}))],
 ['D3 · Klein spoor in het midden','Een kort spoortje (44px) onderaan in het midden, zoals de grijper van een sheet. Het lichte stukje schuift mee.',noStatus(head({afterGreeting:pillWithBar('d3')}))],
];
document.body.innerHTML=S.map(([title,sub,html])=>`<div><p class="cap">${title}<small>${sub}</small></p>${html}</div>`).join('');
</script></html>
