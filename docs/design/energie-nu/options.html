<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Energie nu</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:112px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;
--stroom:#d55181;--zon:#c98500;--terug:#6bab3e;--gas:#199e70;
position:relative;width:390px;height:844px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.sec .live{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:400}.sec .live i{width:7px;height:7px;border-radius:50%;background:#3fb950}
.card{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:14px 16px}
.card+.card{margin-top:10px}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:30px;font-weight:600;letter-spacing:-.01em}.big i{font-style:normal;font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.mid{font-size:20px;font-weight:600}.mid i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* A: flow */
.flow{position:relative;height:292px;box-sizing:border-box}
.node{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.node .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.node .ring svg{width:24px;height:24px}
.node b{font-size:17px;font-weight:600}.node small{font-size:12px;color:var(--muted)}
.flow svg.lines{position:absolute;inset:0;width:100%;height:100%;stroke-width:2;fill:none}
/* kwartier */
.meter{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.3);margin:12px 0 6px;overflow:visible}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--stroom)}
.meter .peak{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text);border-radius:1px}
.meterlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.today .card{padding:12px}.today .card+.card{margin-top:0}
.today .mid{font-size:18px}.today .lbl{font-size:12px;white-space:nowrap}.today .dot{margin-right:5px}
/* B */
.chart{position:relative;height:120px;margin:12px -4px 4px}
.chart svg{width:100%;height:100%;stroke-width:2}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{flex:1;border-radius:14px;background:rgba(0,0,0,.22);padding:8px 10px}
.chip .lbl{font-size:12px}.chip b{display:block;font-size:16px;font-weight:600;margin-top:2px}
/* C */
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px}
.split span{display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}.legend b{color:var(--text);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.phase{border-radius:12px;background:rgba(0,0,0,.22);padding:8px 10px;font-size:12px;color:var(--muted)}.phase b{display:block;color:var(--text);font-size:15px;font-weight:600}
.nav{position:absolute;left:14px;right:14px;bottom:16px;height:70px;border-radius:30px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
</style></head><body></body>
<script>
const svg=(inner,extra='')=>`<svg viewBox="0 0 24 24"${extra}>${inner}</svg>`;
const I={sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
home:svg('<path d="M4 11l8-7 8 7v9H4z"/>'),bolt:svg('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),pylon:svg('<path d="M8 21l4-18 4 18M6 8h12M7 13h10M9.5 21l5-8M14.5 21l-5-8"/>'),flame:svg('<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>')};
const head=(right='')=>`<div class="kicker">Categorie</div><h1>Energie</h1><div class="sec"><span>Nu</span><span class="live"><i></i>live</span></div>`;
const node=(c,icon,value,label,style)=>`<div class="node" style="--c:${c};${style}"><span class="ring">${I[icon]}</span><b>${value}</b><small>${label}</small></div>`;
const kwartier=`<div class="card"><div class="row"><span class="lbl">Dit kwartier (gemiddeld)</span><span class="lbl">Piek deze maand</span></div>
 <div class="row"><span class="mid">0,4<i>kW</i></span><span class="mid">3,6<i>kW</i></span></div>
 <div class="meter"><span class="fill" style="width:11%"></span><span class="peak" style="left:72%"></span></div>
 <div class="meterlbl"><span>Nog 9 min in dit kwartier</span><span>12 okt · 18:15</span></div></div>`;
const today=`<div class="sec"><span>Vandaag tot nu</span></div><div class="today">
 <div class="card"><span class="lbl"><span class="dot" style="background:var(--stroom)"></span>Afgenomen</span><div class="mid">4,82<i>kWh</i></div></div>
 <div class="card"><span class="lbl"><span class="dot" style="background:var(--terug)"></span>Terug</span><div class="mid">6,10<i>kWh</i></div></div>
 <div class="card"><span class="lbl"><span class="dot" style="background:var(--gas)"></span>Gas</span><div class="mid">2,78<i>m³</i></div></div></div>`;
const flowLines=`<svg class="lines" viewBox="0 0 342 292">
 <path d="M139 42 Q 84 50 78 138" stroke="var(--zon)" stroke-dasharray="4 6"/>
 <path d="M203 42 Q 258 50 264 138" stroke="var(--terug)" stroke-dasharray="4 6"/>
 <path d="M114 174 H 228" stroke="rgba(245,244,239,.15)" stroke-dasharray="4 6"/></svg>`;
const A=`${head()}<div class="card flow">${flowLines}
 ${node('var(--zon)','sun','2.140 W','Zon','left:123px;top:8px')}
 ${node('var(--accent)','home','1.290 W','Huis','left:30px;top:142px')}
 ${node('var(--terug)','pylon','850 W','Terug naar net','left:216px;top:142px')}
 <div style="position:absolute;left:16px;right:16px;bottom:14px;font-size:13px;color:var(--muted);text-align:center">Het huis draait volledig op zon · 40% gaat terug</div></div>
 ${kwartier}${today}<div class="nav"></div>`;
const Anosun=`${head()}<div class="card" style="text-align:center;padding:22px 16px">
 <div style="display:inline-flex;width:64px;height:64px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--terug);background:color-mix(in srgb,var(--terug) 12%,transparent);color:var(--terug);align-items:center;justify-content:center">${svg('<path d="M8 21l4-18 4 18M6 8h12M7 13h10M9.5 21l5-8M14.5 21l-5-8"/>',' style="width:26px;height:26px"')}</div>
 <div class="big" style="margin-top:10px">850<i>W</i></div><div class="lbl">Terug naar het net</div>
 <div class="lbl" style="margin-top:12px">Zonder omvormer zie je alleen wat de meter ziet: afnemen of terugleveren.</div></div>
 ${kwartier}${today}<div class="nav"></div>`;
// B: big number + the last hour
const line=`<svg viewBox="0 0 342 120" preserveAspectRatio="none">
 <line x1="0" y1="60" x2="342" y2="60" stroke="rgba(245,244,239,.18)" stroke-width="1"/>
 <path d="M0 40 C 30 30, 50 45, 70 50 S 110 62, 130 66 S 170 82, 200 88 S 260 92, 290 86 S 330 84, 342 85" stroke="var(--terug)" fill="none"/>
 <path d="M0 40 C 30 30, 50 45, 70 50 S 110 62, 130 66 L130 60 L0 60 Z" fill="color-mix(in srgb,var(--stroom) 30%,transparent)" stroke="none"/>
 <path d="M130 66 S 170 82, 200 88 S 260 92, 290 86 S 330 84, 342 85 L342 60 L130 60 Z" fill="color-mix(in srgb,var(--terug) 28%,transparent)" stroke="none"/>
 <path d="M0 40 C 30 30, 50 45, 70 50 S 110 62, 130 66" stroke="var(--stroom)" fill="none"/>
</svg>`;
const B=`${head()}<div class="card"><span class="lbl"><span class="dot" style="background:var(--terug)"></span>Terug naar het net</span>
 <div class="big" style="font-size:40px">850<i>W</i></div>
 <div class="chart">${line}</div><div class="meterlbl"><span>14:20</span><span>Laatste uur</span><span>nu</span></div>
 <div class="chips"><div class="chip"><span class="lbl">☀ Zon</span><b>2.140 W</b></div><div class="chip"><span class="lbl">Huis</span><b>1.290 W</b></div><div class="chip"><span class="lbl">Piek vandaag</span><b>3,1 kW</b></div></div></div>
 ${kwartier}${today}<div class="nav"></div>`;
// C: where it comes from, where it goes, per phase
const C=`${head()}<div class="card"><div class="row"><span class="lbl">Huis gebruikt</span><span class="lbl">Zon levert</span></div>
 <div class="row"><span class="big">1.290<i>W</i></span><span class="big" style="color:var(--zon)">2.140<i>W</i></span></div>
 <div class="lbl" style="margin-top:12px">Waar je zon naartoe gaat</div>
 <div class="split"><span style="flex:60;background:var(--accent)"></span><span style="flex:40;background:var(--terug)"></span></div>
 <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Huis <b>1.290 W</b></span><span><span class="dot" style="background:var(--terug)"></span>Terug <b>850 W</b></span></div>
 <div class="lbl" style="margin-top:14px">Per fase (net)</div>
 <div class="phases"><div class="phase">L1<b>−620 W</b>231 V</div><div class="phase">L2<b>−410 W</b>229 V</div><div class="phase">L3<b>+180 W</b>232 V</div></div></div>
 ${kwartier}${today}<div class="nav"></div>`;
const S=[
 ['A · Stroomschema','Zon, huis en net als drie cirkels met de stroom ertussen, zoals HA\'s eigen energiekaart: je ziet in één oog waar het vandaan komt en heen gaat. Onderaan in één zin wat dat betekent.',A],
 ['B · Groot getal en het laatste uur','Wat er nu met het net gebeurt, groot, met de lijn van het laatste uur eronder: boven de lijn afnemen (roze), eronder terugleveren (groen). Zon, huis en de piek van vandaag als kleine vakjes.',B],
 ['C · Waar het heen gaat, per fase','Wat het huis gebruikt en wat de zon levert, met een balk die toont waar je zonnestroom heen gaat. Daaronder het net per fase, met de spanning: handig om te zien waar een grote verbruiker hangt.',C],
 ['A zonder omvormer','Als er geen omvormer-sensor is: alleen wat de meter ziet. Het kwartier en "Vandaag tot nu" blijven hetzelfde, in elke variant.',Anosun],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
