<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Media dock</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:28px 28px}
.cap{min-height:74px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.row-title{grid-column:1/-1;margin:14px 0 -10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#73726c}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);--track:rgba(245,244,239,.12);
position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:28px 24px 0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
.date{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:31px}
.status{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 16px;font-size:15px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:22px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.warn{margin-top:16px;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,#b42318 42%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,#b42318 60%,transparent)}
.warn .wi{width:34px;height:34px;border-radius:10px;background:#b42318;display:grid;place-items:center;color:#fff}.warn b{display:block;font-size:15px}.warn span{font-size:13px;color:#f2a49c}
.sec{margin:26px 4px 10px;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.list{border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;padding:10px 14px}.lrow+.lrow{box-shadow:inset 0 1px 0 var(--border)}
.lic{width:32px;height:32px;border-radius:10px;background:var(--bg);color:var(--accent);display:grid;place-items:center}.lic svg{width:18px;height:18px}
.lrow b{flex:1;font-size:15px;font-weight:500}.go{padding:6px 13px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:600}
.power{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.power b{font-size:20px}.power span{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{height:112px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 14px;box-sizing:border-box;position:relative;overflow:hidden}
.tile span{font-size:13px;color:var(--muted)}.tile b{display:block;font-size:24px;margin-top:4px}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(color-mix(in srgb,var(--c) 40%,transparent),color-mix(in srgb,var(--c) 15%,transparent));border-top:2px solid var(--c)}
/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 16px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
.nav{display:flex;justify-content:space-around;padding:10px 6px 8px;border-radius:26px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}.nav svg{width:20px;height:20px}.nav .on{color:var(--accent)}
.fade{background:radial-gradient(circle at 72% 28%,#9fd8ff,transparent 45%),radial-gradient(circle at 18% 82%,#7a5cff,transparent 55%),linear-gradient(135deg,#2b3f8f,#151a3a)}
.fade.sonos{background:radial-gradient(circle at 70% 30%,#f2c48d,transparent 45%),radial-gradient(circle at 20% 80%,#e0557a,transparent 55%),linear-gradient(135deg,#8a3b2c,#2a1a1d)}
.dim{filter:brightness(.8)}
/* the current card */
.card{padding:12px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35)}
.top{display:flex;gap:12px;align-items:center}
.thumb{width:96px;height:54px;border-radius:12px;flex:none}.thumb.big{width:112px;height:63px}
.top .t{flex:1;min-width:0}.top b{display:block;font-size:16px}.top span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pause{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.btns{display:flex;gap:6px;margin-top:10px}
.pb{flex:1;display:flex;align-items:center;gap:7px;height:34px;padding:0 4px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border);font-size:13px;font-weight:600}
.pb i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b3121c 60%,#3a0a0d);filter:brightness(.75) saturate(.85)}
.pb i.v{background:radial-gradient(circle at 35% 30%,#ff9aa0,#e0333a 60%,#1b1d52)}.pb i.g{background:radial-gradient(circle at 35% 30%,#e555d9,#fa077e 50%,#ff8518)}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:4px;border-radius:2px;background:var(--track);position:relative}.prog .bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:2px;background:var(--accent)}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0 10px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--track)}.dots i.on{width:16px;background:var(--text)}
/* slim bar */
.slim{position:relative;display:flex;gap:12px;align-items:center;height:56px;box-sizing:border-box;padding:0 8px 0 8px;margin-bottom:10px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.slim .thumb{width:40px;height:40px;border-radius:11px}
.slim .t{flex:1;min-width:0}.slim b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slim span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.slim .chev{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.slim .line{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:1px;background:var(--track)}.slim .line::before{content:"";position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--accent);border-radius:1px}
.devs{display:flex;gap:4px;margin-right:2px}.devs span{width:30px;height:30px;margin:0;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}.devs svg{width:16px;height:16px}
/* round button */
.fab{position:absolute;right:20px;bottom:104px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.4);color:var(--muted)}
.fab svg{width:22px;height:22px}
.note{position:absolute;left:24px;right:24px;font-size:11px;color:#6f6c66;letter-spacing:.02em}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}

/* button strips */
.strip{display:flex;gap:6px;align-items:center}
.dev{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:rgba(255,255,255,.9)}.dev svg{width:17px;height:17px}
.strip .pb{height:34px;min-width:0;white-space:nowrap;gap:6px}.strip .pb i{width:22px;height:22px;flex:none}
.cardS{padding:8px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35)}
.cardS .strip+.strip{margin-top:8px}
.bare{padding:0 2px 10px}.dock.solid{padding-top:30px;background:linear-gradient(transparent,var(--bg) 30px)}
.bare .pb{background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:inset 0 0 0 1px var(--border)}

.navbox{border-radius:26px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.navbox .nav{background:none;box-shadow:none;border-radius:0}
.navrow{padding:8px 8px 7px;box-shadow:inset 0 -1px 0 var(--border)}
.chips{display:flex;gap:6px;align-items:center;overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 6px;border-radius:999px;background:var(--bg);font-size:12px;font-weight:600;white-space:nowrap}
.chip i,.circ i{width:16px;height:16px;border-radius:50%;flex:none;filter:brightness(.75) saturate(.85)}
.chip.chipdev{padding:0 6px;color:var(--muted);background:none}.chip.chipdev svg{width:16px;height:16px}
.sep{flex:none;width:1px;height:16px;background:var(--border);margin:0 2px}
.circs{display:grid;grid-template-columns:repeat(6,1fr)}
.circ{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:500}
.circ i{width:30px;height:30px}
.seg{display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--bg);flex:none}.seg span{width:30px;height:24px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}.seg span.on{background:var(--surface);color:var(--text)}.seg svg{width:15px;height:15px}
.three{display:flex;gap:6px;flex:1}.three .chip{flex:1;justify-content:flex-start}
.slimcard{position:relative;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 8px;margin-bottom:8px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.slimcard .thumb{width:72px;height:40px;border-radius:10px}
.slimcard .t{flex:1;min-width:0}.slimcard b{display:block;font-size:15px}.slimcard span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slimcard .line{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--track)}.slimcard .line::before{content:"";position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--accent)}

.three .chip.fit{flex:0 1 auto;padding:0 9px 0 5px;gap:5px}
.three.fitrow{gap:5px}
.chip.icononly{flex:none;width:28px;padding:0;justify-content:center}
.sonosart{position:relative}.sonosart::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:5px;background:radial-gradient(circle at 30% 30%,#ffd28a,#e0557a 60%,#5a2333)}
.scrollchips{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.scrollchips .chip{flex:none}
</style></head><body></body>
<script>
const svg=(inner,cls='')=>`<svg viewBox="0 0 24 24" class="${cls}">${inner}</svg>`;
const I={
 baby:svg('<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>'),
 garage:svg('<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>'),
 home:svg('<path d="M4 11l8-7 8 7v9H4z"/>'),sofa:svg('<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 11h20v6H2zM5 17v2M19 17v2"/>'),
 sprout:svg('<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/>'),
 bolt:svg('<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'),
 pause:svg('<rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/>','fill'),
 up:svg('<path d="M6 15l6-6 6 6"/>'),
 tv:svg('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/>'),
 speaker:svg('<rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><path d="M12 7h.01"/>'),
 music:svg('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'),
};
const page=(extra='')=>`<div class="in">
 <div class="date">Maandag 26 oktober</div><h1>Goedenavond, Jeroen</h1>
 <div class="status"><i></i>Je bent thuis · 2 lichten aan · 1 airco aan</div>
 <div class="warn"><span class="wi">${I.garage}</span><div><b>Garagepoort staat open</b><span>Sinds 20:59</span></div></div>
 <p class="sec">Snel</p>
 <div class="list"><div class="lrow"><span class="lic">${I.baby}</span><b>Pré slaapje</b><span class="go">Start</span></div><div class="lrow"><span class="lic">${I.garage}</span><b>Garagedeur</b><span class="go">Start</span></div></div>
 <p class="sec">Verbruik</p>
 <div class="power"><span class="lic" style="color:#d55181">${I.bolt}</span><div><b>196 W</b><br><span>Nu</span></div></div>
 <div class="tiles"><div class="tile" style="--c:#d55181"><span>Stroom</span><b>8,13 kWh</b></div><div class="tile" style="--c:#c98500"><span>Zon</span><b>1,24 kWh</b></div>
 <div class="tile" style="--c:#3987e5"><span>Water</span><b>0,102 m³</b></div><div class="tile" style="--c:#199e70"><span>Gas</span><b>2,78 m³</b></div></div>
 ${extra}</div>`;
const tabs=`<div class="nav"><div class="on">${I.home}Thuis</div><div>${I.sofa}Living</div><div>${I.baby}Marielou</div><div>${I.garage}Garage</div><div>${I.sprout}Tuin</div></div>`;
const nav=tabs;
const navWith=(row)=>`<div class="navbox"><div class="navrow">${row}</div>${tabs}</div>`;
const idleCard=`<div class="card"><div class="top"><span class="thumb fade dim"></span><div class="t"><b>TV op Chromecast</b><span>Kies een app om te openen</span></div></div>
 <div class="btns"><span class="pb"><i></i>Netflix</span><span class="pb"><i class="v"></i>VRT MAX</span><span class="pb"><i class="g"></i>VTM GO</span></div></div><div class="dots"><i class="on"></i><i></i></div>`;
const playingCard=`<div class="card"><div class="top"><span class="thumb big fade"></span><div class="t"><b>Planet Earth III</b><span>Netflix</span></div><span class="pause">${I.pause}</span></div>
 <div class="prog">32:10<span class="bar"></span>−19:39</div></div><div class="dots"><i class="on"></i><i></i></div>`;
const slimIdle=`<div class="slim"><span class="thumb fade dim" style="display:grid;place-items:center;color:rgba(255,255,255,.85)">${I.music}</span><div class="t"><b>Media</b><span>Niets aan het spelen</span></div><span class="chev">${I.up}</span></div>`;
const slimPlaying=`<div class="slim"><span class="thumb fade"></span><div class="t"><b>Planet Earth III</b><span>Netflix · TV</span></div><span class="pause">${I.pause}</span><span class="line"></span></div>`;
const phone=(dockTop,{scroll=0,extra='',over='',dock='',navRowHtml=''}={})=>`<div class="phone"><div style="transform:translateY(-${scroll}px)">${page(extra)}</div>${over}<div class="dock ${dock}">${dockTop}${navRowHtml||nav}</div></div>`;
const inPage=`<p class="sec">Media</p>${idleCard.replace('box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.35)','')}<div style="height:130px"></div>`;
const unfolded=`<div class="backdrop"></div>`;
const G1=['#f0323b','#e50914','#141414'],G2=['#ff4f55','#f5333a','#1b1d52'],G3=['#e555d9','#fa077e','#ff8518'],R1=['#ff4942','#0068d8','#002a66'],R2=['#ff4942','#7e31aa','#331a5c'],R3=['#ff4942','#c0b06c','#434540'];
const ball=(c)=>`<i style="background:radial-gradient(circle at 35% 30%,${c[0]},${c[1]} 55%,${c[2]})"></i>`;
const APPS=[['Netflix',G1],['VRT',G2],['VTM',G3],['HBO',['#b18cff','#5b2be0','#120a3a']],['DAZN',['#f4f4f0','#3a3a38','#0b0b0b']]],STATIONS=[['Radio 1',R1],['StuBru',R2],['Tijdloze',R3]];
const chip=([n,c])=>`<span class="chip">${ball(c)}${n}</span>`;
const SP=['#5ef08f','#1db954','#0b3d1f'];
const STATIONS4=[...STATIONS,['Spotify',SP]];
const seg=(first)=>`<span class="seg"><span class="${first?'on':''}">${I.speaker}</span><span class="${first?'':'on'}">${I.tv}</span></span>`;
const rowSonos=`<div style="display:flex;gap:8px;align-items:center">${seg(true)}<div class="three fitrow">${STATIONS4.map(([n,c])=>`<span class="chip fit">${ball(c)}${n}</span>`).join('')}</div></div>`;
const rowSonosIcon=`<div style="display:flex;gap:8px;align-items:center">${seg(true)}<div class="scrollchips">${[['Spotify',SP],...STATIONS].map(([n,c])=>`<span class="chip">${ball(c)}${n}</span>`).join('')}</div></div>`;
const rowTv=`<div style="display:flex;gap:8px;align-items:center">${seg(false)}<div class="scrollchips">${APPS.map(chip).join('')}</div></div>`;
const rowTvScrolled=rowTv.replace('<div class="scrollchips">','<div class="scrollchips" style="-webkit-mask-image:linear-gradient(to right,transparent,#000 15%);mask-image:linear-gradient(to right,transparent,#000 15%);justify-content:flex-end">');
const slim=(art,title,sub,dots)=>`<div class="slimcard"><span class="thumb ${art}"></span><div class="t"><b>${title}</b><span>${sub}</span></div><span class="pause">${I.pause}</span><span class="line"></span></div>${dots?`<div class="dots" style="margin:0 0 8px">${dots}</div>`:''}`;
const sonosSlim=(dots)=>slim('fade sonos sonosart','Radio 1','Arctic Monkeys – Do I Wanna Know?',dots);
const tvSlim=(dots)=>slim('fade','Planet Earth III','Netflix',dots);
window.__rows={rowSonos};
const S=[
 ['row','Niets speelt'],
 ['Sonos (standaard)','Sonos eerst. Spotify (opent de app), dan de zenders. De knoppen scrollen opzij, de schakelaar blijft staan; wisselen enkel met een tik op de iconen.',phone('',{navRowHtml:navWith(rowSonosIcon)})],
 ['Sonos · start een zender','Zoals nu: een spinner in de knop tot de Sonos speelt, na ±10 s "Dat lukte niet".',phone('',{navRowHtml:navWith(rowSonosIcon.replace(ball(R1),'<i style="background:none;border:2px solid var(--track);border-top-color:var(--accent);box-sizing:border-box;filter:none"></i>'))})],
 ['TV','Na een tik op het TV-icoon: Netflix, VRT, VTM, HBO en DAZN. Ook hier scrollen de knoppen opzij.',phone('',{navRowHtml:navWith(rowTv)})],
 ['row','Er speelt iets'],
 ['Sonos speelt','De smalle speler boven de navigatie. Een tik opent de grote speler zoals nu. Gepauzeerd blijft hij nog 15 minuten staan.',phone(sonosSlim(''),{navRowHtml:navWith(rowSonosIcon)})],
 ['Allebei','Twee pagina\'s, de Sonos eerst. De speler swipe je zoals nu (ook de grote); de schakelaar volgt de pagina.',phone(sonosSlim('<i class="on"></i><i></i>'),{navRowHtml:navWith(rowSonosIcon)})],
 ['TV speelt','Enkel de TV-pagina, zonder bolletjes. De schakelaar springt op TV. Hier opzij gescrold tot HBO en DAZN.',phone(tvSlim(''),{navRowHtml:navWith(rowTvScrolled)})],
];
document.body.innerHTML=S.map(([title,sub,html])=>title==='row'?`<p class="row-title">${sub}</p>`:`<div><p class="cap">${title}<small>${sub}</small></p>${html}</div>`).join('');
</script></html>
