<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Vandaag tot nu extra</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:110px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;--good:#8fca6a;--bad:#e58aa9;
position:relative;width:390px;height:230px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 4px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 14px 14px;overflow:hidden}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.name span{display:grid;color:var(--c)}
.value{margin:6px 0 0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.value small{margin-left:3px;font-size:13px;font-weight:500;color:var(--muted)}
.extra{white-space:nowrap;margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.extra b{font-weight:600}
.up,.down{font-weight:600}
.hours{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:10px}.hours span{flex:1;border-radius:1.5px;background:var(--c);opacity:.85}.hours span.empty{background:rgba(245,244,239,.08);opacity:1;height:2px!important}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
.progress{height:6px;border-radius:3px;background:rgba(0,0,0,.3);margin-top:10px;position:relative}.progress i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}.progress b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={pylon:svg('<path d="M8 21l4-18 4 18M6 8h12M7 13h10M9.5 21l5-8M14.5 21l-5-8"/>'),sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')};
const tile=(taken,extra)=>`<div class="tile" style="--c:${taken?'var(--from)':'var(--back)'}"><p class="name"><span>${taken?I.pylon:I.sun}</span>${taken?'Afgenomen':'Teruggeleverd'}</p><p class="value">${taken?'4,82':'6,10'}<small>kWh</small></p>${extra}</div>`;
const page=(takenExtra,backExtra)=>`<div class="sec">Vandaag tot nu</div><div class="tiles">${tile(true,takenExtra)}${tile(false,backExtra)}</div>`;
// per hour today, 0:00..15:00 (taken / fed back)
const TAKEN=[0.24,0.21,0.19,0.18,0.2,0.32,0.45,0.38,0.12,0.02,0,0,0,0,0.04,0.3];
const BACK=[0,0,0,0,0,0,0,0,0.06,0.26,0.64,0.91,1.02,0.88,0.54,0.4];
const hours=(values)=>{const top=Math.max(...values);return `<div class="hours">${Array.from({length:24},(_,h)=>h<values.length?`<span style="height:${Math.max(6,values[h]/top*100)}%"></span>`:'<span class="empty"></span>').join('')}</div><div class="axis"><span>0u</span><span>12u</span><span>24u</span></div>`;};
const S=[
 ['E1 · Vergeleken met gisteren','Onder het getal: hoeveel het gisteren tot hetzelfde uur was, en het verschil. Minder afnemen is groen, meer terugleveren ook. Uit HA\'s uurstatistieken.',page('<div class="extra">Gisteren 5,60 · <span class="down" style="color:var(--good)">↓ 14%</span></div>','<div class="extra">Gisteren 4,20 · <span class="up" style="color:var(--good)">↑ 45%</span></div>')],
 ['E2 · Per uur van vandaag','Een rij kleine staafjes, één per uur van 0 tot 24 uur. Je ziet wanneer je afnam (\'s ochtends en \'s avonds) en wanneer de zon terugleverde (middag). Uit HA\'s uurstatistieken.',page(hours(TAKEN),hours(BACK))],
 ['E3 · Wat het kost en opbrengt','Het bedrag erbij: afnemen × je prijs per kWh, terugleveren × je injectieprijs. Vraagt twee prijzen in de config (hier €0,30 en €0,04 per kWh).',page('<div class="extra">≈ <b style="color:var(--text)">€ 1,45</b> kost</div>','<div class="extra">≈ <b style="color:var(--text)">€ 0,24</b> opbrengst</div>')],
 ['E4 · Tegenover een gewone dag','Een balkje: hoe ver je bent tegenover je gemiddelde van de laatste 7 dagen (het witte streepje). Afnemen boven je gemiddelde valt zo meteen op.',page('<div class="progress"><i style="width:52%"></i><b style="left:64%"></b></div><div class="extra">Gemiddeld 6,10 per dag</div>','<div class="progress"><i style="width:78%"></i><b style="left:58%"></b></div><div class="extra">Gemiddeld 4,50 per dag</div>')],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
