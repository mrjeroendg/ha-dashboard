<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Categorieën in de navigatie</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:112px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.cap.short{min-height:0}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
position:relative;width:390px;height:700px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.date{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:31px}
.band{display:flex;gap:10px;align-items:center;height:46px;box-sizing:border-box;margin-top:14px;padding:0 18px;font-size:15px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:22px}
.band b{font-weight:400;color:var(--text)}.band svg{width:18px;height:18px}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.dock{height:76px;border-radius:20px;background:rgba(48,48,46,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.08)}
.cam{aspect-ratio:16/9;border-radius:18px;background:radial-gradient(60% 50% at 35% 72%,#55604f,transparent 70%),linear-gradient(180deg,#2d3530,#1a1f1c)}
/* the Verbruik page (placeholder) */
.chart{height:170px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);position:relative;overflow:hidden;margin-top:18px}
.chart::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(236,72,153,.28),transparent);border-top:2px solid #ec4899;border-radius:50% 40% 0 0/40% 60% 0 0}
.chart small{position:absolute;left:14px;top:12px;font-size:13px;color:var(--muted)}.chart b{position:absolute;left:14px;top:30px;font-size:26px;font-weight:600}
.periods{display:flex;gap:6px;margin-top:16px}.periods span{padding:7px 13px;border-radius:999px;background:var(--surface);font-size:13px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}.periods span.on{background:var(--soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.stat{height:90px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
/* bottom: mini player + nav */
.bottom{position:absolute;left:14px;right:14px;bottom:16px}
.mini{height:58px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;gap:12px;padding:0 10px;box-sizing:border-box;margin-bottom:8px}
.mini .art{width:58px;height:40px;border-radius:10px;background:radial-gradient(circle at 60% 40%,#9fd3ff,#6a4cff 55%,#2a2470)}
.mini b{font-size:15px}.mini small{display:block;font-size:13px;color:var(--muted)}
.nav{border-radius:30px;overflow:hidden;background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:inset 0 0 0 1px var(--border)}
.navtop{height:44px;box-shadow:inset 0 -1px 0 var(--border);display:flex;gap:6px;align-items:center;padding:0 10px}
.navtop span{height:28px;border-radius:999px;background:rgba(0,0,0,.2);flex:none}
.scroller{display:flex;gap:4px;padding:6px 14px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.track{display:flex;gap:4px;align-items:center}
.item{flex:none;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px 7px;font-size:12px;color:var(--muted);box-sizing:border-box}
.item.on{color:var(--accent)}
.divider{flex:none;width:1px;height:30px;background:rgba(245,244,239,.14);margin:0 4px}
/* C: categories in their own capsule */
.group{display:flex;gap:2px;padding:0 2px;border-radius:22px;background:rgba(245,244,239,.05);box-shadow:inset 0 0 0 1px rgba(245,244,239,.06);margin-right:6px}
/* D: icons only, name only on the active one */
.item.icononly{min-width:40px;padding:8px 9px 7px}.item.icononly span{display:none}.item.icononly.on span{display:block}
.note{position:absolute;left:0;right:0;font-size:11px;color:#d97757;text-align:center}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={home:svg('<path d="M4 11l8-7 8 7v9H4z"/>'),sofa:svg('<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M3 11h18v6H3zM5 17v2M19 17v2"/>'),
moon:svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),baby:svg('<circle cx="12" cy="13" r="8"/><path d="M12 5c0-1.7 1.8-2.5 2.8-1.3M9 12.5h.01M15 12.5h.01M9.8 16.3c1.3.9 3.1.9 4.4 0"/>'),
garage:svg('<path d="M3 21V9l9-5 9 5v12M7 21v-8h10v8M7 16h10"/>'),monitor:svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
bed:svg('<path d="M3 18V6M3 13h18v5M21 13v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="10" r="1.6"/>'),
bolt:svg('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),camera:svg('<path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/>'),
music:svg('<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'),
cake:svg('<path d="M4 21h16M5 21v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6M12 13v-3"/>')};
const ROOMS=[['home','Thuis'],['sofa','Living'],['moon','Slaapkamer'],['baby','Marielou'],['garage','Garage'],['monitor','Bureau'],['bed','Gasten']];
const CATS=[['music','Media'],['camera',"Camera's"],['bolt','Verbruik']];
const item=([i,n],active,cls='')=>`<span class="item ${cls}${n===active?' on':''}">${I[i]}<span>${n}</span></span>`;
const nav=(track,shift,withTop)=>`<div class="nav">${withTop?'<div class="navtop"><span style="width:56px"></span><span style="width:76px"></span><span style="width:60px"></span><span style="width:64px"></span><span style="width:60px"></span></div>':''}<div class="scroller"><div class="track" style="transform:translateX(${shift}px)">${track}</div></div></div>`;
const thuis=`<div class="date">Dinsdag 3 november</div><h1>Goedemiddag, Jeroen</h1>
 <div class="band"><span style="color:var(--accent);display:grid">${I.home}</span><b>Je bent thuis</b> · <span style="color:#ec8fb5;display:grid">${I.cake}</span><b>2 jarigen</b></div>
 <div class="sec">Snel</div><div class="dock"></div><div class="sec">Camera's</div><div class="cam"></div>`;
const verbruik=`<div class="date">Categorie</div><h1>Verbruik</h1>
 <div class="periods"><span>Dag</span><span class="on">Week</span><span>Maand</span><span>Jaar</span></div>
 <div class="chart"><small>Stroom deze week</small><b>54,2 kWh</b></div><div class="stats"><div class="stat"></div><div class="stat"></div><div class="stat"></div><div class="stat"></div></div>`;
const phone=(body,navHtml,isThuis)=>`<div class="phone"><div class="in">${body}</div><div class="bottom">${isThuis?'<div class="mini"><span class="art"></span><div><b>Planet Earth III</b><small>Netflix</small></div></div>':''}${navHtml}</div></div>`;
const rooms=(active,cls)=>ROOMS.map((r)=>item(r,active,cls)).join('');
const divider='<span class="divider"></span>';
// A: only Verbruik, first, with a divider
const trackA=(active)=>item(CATS[2],active)+divider+rooms(active);
// B: several categories left of Thuis; opens with half of Verbruik peeking in
const trackB=(active)=>CATS.map((c)=>item(c,active)).join('')+divider+rooms(active);
// C: the categories in their own capsule
const trackC=(active)=>`<span class="group">${CATS.map((c)=>item(c,active)).join('')}</span>`+rooms(active);
// D: categories as icons only (name on the active one), so all fit next to Thuis
const trackD=(active)=>CATS.map((c)=>item(c,active,'icononly')).join('')+divider+rooms(active);
const S=[
 ['A · Alleen Verbruik, vooraan','Zolang er één categorie is: Verbruik als eerste item, met een dun streepje tussen Verbruik en Thuis. Niets verborgen, geen scrollen naar links. Thuis blijft de startpagina.',phone(thuis,nav(trackA('Thuis'),0,true),true)],
 ['B · Meerdere, Verbruik piept binnen','Media, Camera\'s en Verbruik links van Thuis. De balk opent met Thuis bijna vooraan; de helft van Verbruik steekt links uit, in de zachte rand. Naar rechts vegen toont de categorieën.',phone(thuis,nav(trackB('Thuis'),-178,true),true)],
 ['C · Categorieën in een eigen groep','Zoals B, maar de categorieën staan samen in een licht omrande groep in plaats van achter een streepje. Zo lees je meteen dat het iets anders is dan de kamers.',phone(thuis,nav(trackC('Thuis'),-172,true),true)],
 ['D · Categorieën als iconen','Alleen het icoon, de naam pas als je er bent. Zo passen drie categorieën naast Thuis zonder te scrollen. Het compactst, maar je moet de iconen leren kennen.',phone(thuis,nav(trackD('Thuis'),0,true),true)],
 ['A · op Verbruik','Zonder mini-speler en snelkoppelingen: die horen bij Thuis.',phone(verbruik,nav(trackA('Verbruik'),0,false),false)],
 ['B · op Verbruik','De balk blijft zo staan dat Verbruik zichtbaar is.',phone(verbruik,nav(trackB('Verbruik'),0,false),false)],
 ['C · op Verbruik','',phone(verbruik,nav(trackC('Verbruik'),0,false),false)],
 ['D · op Verbruik','Op de actieve categorie verschijnt de naam.',phone(verbruik,nav(trackD('Verbruik'),0,false),false)],
];
document.body.innerHTML=S.map(([t,sub,h],k)=>`<div><p class="cap${k>=4?' short':''}">${t}${sub?`<small>${sub}</small>`:''}</p>${h}</div>`).join('');
</script></html>
