<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Energie vandaag</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:92px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;--gas:#199e70;--water:#3987e5;
position:relative;width:390px;height:700px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.card{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 0}
.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lbl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.big{font-size:40px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(63,185,80,.14);color:#7fd18b;font-size:12px;font-weight:600}.badge i{width:6px;height:6px;border-radius:50%;background:#3fb950}
.graph{display:block;width:100%;height:64px;margin-top:6px}
.axis{display:flex;justify-content:space-between;padding:2px 16px 10px;font-size:11px;color:var(--muted)}
/* tiles */
.tiles{display:grid;gap:10px}.tiles.three{grid-template-columns:repeat(3,1fr)}.tiles.two{grid-template-columns:1fr 1fr}
.tile{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 12px 13px}
.tile .head{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.tile .head span{display:grid;color:var(--c)}
.tile b{display:block;margin-top:6px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.tile b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.two .tile b{font-size:26px}
/* list */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px}.row+.row{box-shadow:inset 0 1px 0 var(--border)}
.row .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.row .name{flex:1;font-size:15px}.row .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.row .val small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
/* balance */
.balance{padding:14px 16px}.balance .split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 8px}
.balance .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.balance .legend b{color:var(--text);font-weight:600}
.balance .net{font-size:13px;color:var(--muted);margin-top:8px}.balance .net b{color:#8fca6a;font-weight:600}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={down:svg('<path d="M12 5v14M6 13l6 6 6-6"/>'),up:svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),flame:svg('<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>'),drop:svg('<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>')};
const HOUR=[310,280,260,180,90,-40,-180,-320,-420,-610,-780,-850];
function bars(values){const W=342,H=64,top=Math.max(0,...values),bottom=Math.min(0,...values);const y=(v)=>4+(top-v)/(top-bottom)*(H-8),zero=y(0),slot=W/values.length,width=slot*.62;
 return `<svg class="graph" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="rgba(245,244,239,.16)"/>${values.map((v,i)=>{const yy=y(v);return `<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${Math.min(yy,zero).toFixed(1)}" width="${width.toFixed(1)}" height="${Math.max(1.5,Math.abs(yy-zero)).toFixed(1)}" rx="2" stroke="none" fill="${v<0?'#6bab3e':'#d55181'}"/>`}).join('')}</svg>`;}
const nu=`<div class="kicker">Categorie</div><h1>Energie</h1><div class="sec">Nu</div>
 <div class="card" style="--c:#6bab3e"><div class="top"><div><span class="lbl"><i></i>Terug naar het net</span><div class="big">850<small>W</small></div></div><span class="badge"><i></i>Live</span></div>${bars(HOUR)}<div class="axis"><span>1 uur geleden</span><span>nu</span></div></div>
 <div class="sec">Vandaag tot nu</div>`;
const tile=(c,icon,name,value,unit)=>`<div class="tile" style="--c:${c}"><div class="head"><span>${I[icon]}</span>${name}</div><b>${value}<small>${unit}</small></b></div>`;
const A=nu+`<div class="tiles three">${tile('var(--from)','down','Afgenomen','4,82','kWh')}${tile('var(--back)','up','Terug','6,10','kWh')}${tile('var(--gas)','flame','Gas','2,78','m³')}</div>`;
const row=(c,icon,name,value,unit)=>`<div class="row" style="--c:${c}"><span class="ico">${I[icon]}</span><span class="name">${name}</span><span class="val">${value}<small>${unit}</small></span></div>`;
const B=nu+`<div class="card">${row('var(--from)','down','Afgenomen','4,82','kWh')}${row('var(--back)','up','Teruggeleverd','6,10','kWh')}${row('var(--gas)','flame','Gas','2,78','m³')}</div>`;
const C=nu+`<div class="card balance"><div class="lbl" style="--c:transparent">Stroom</div>
 <div class="split"><span style="flex:4.82;background:var(--from)"></span><span style="flex:6.10;background:var(--back)"></span></div>
 <div class="legend"><span>Afgenomen <b>4,82 kWh</b></span><span>Terug <b>6,10 kWh</b></span></div>
 <div class="net">Netto vandaag: <b>1,28 kWh teruggeleverd</b></div></div>
 <div class="tiles two" style="margin-top:10px">${tile('var(--gas)','flame','Gas','2,78','m³')}${tile('var(--water)','drop','Water','0,102','m³')}</div>`;
const D=nu+`<div class="tiles two">${tile('var(--from)','down','Afgenomen','4,82','kWh')}${tile('var(--back)','up','Teruggeleverd','6,10','kWh')}${tile('var(--gas)','flame','Gas','2,78','m³')}${tile('var(--water)','drop','Water','0,102','m³')}</div>`;
const S=[
 ['A · Drie tegeltjes op een rij','Afgenomen, terug en gas naast elkaar, elk met een klein icoon in zijn kleur en het getal. Compact, en past in één oogopslag.',A],
 ['B · Een lijst in één kaart','Dezelfde drie als rijen, zoals de bedieningen in een kamer: icoon, naam, getal rechts. Rustig, en er kan later makkelijk een rij bij (zon, water).',B],
 ['C · Stroom als balans','Afgenomen en terug in één balk naast elkaar, met wat er netto overblijft ("1,28 kWh teruggeleverd"). Gas en water als twee tegels eronder.',C],
 ['D · Vier tegels, met water','Zoals A, maar 2×2 en met water erbij, groter. Lijkt het meest op de Verbruik-tegels van Thuis, zonder de lijn.',D],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
