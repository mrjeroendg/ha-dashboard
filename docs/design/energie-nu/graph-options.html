<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Energie nu B met grafiek</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:24px 28px}
.cap{min-height:92px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}.cap.short{min-height:0}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);
position:relative;width:390px;height:400px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
.kicker{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.sec{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.card{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 0}
.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.lbl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.big{font-size:40px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(63,185,80,.14);color:#7fd18b;font-size:12px;font-weight:600}.badge i{width:6px;height:6px;border-radius:50%;background:#3fb950}
.graph{display:block;width:100%;height:64px;margin-top:6px}
.period{position:absolute;right:16px;bottom:8px;font-size:11px;color:var(--muted)}
.axis{display:flex;justify-content:space-between;padding:2px 16px 10px;font-size:11px;color:var(--muted)}
</style></head><body></body>
<script>
const W=342,H=64;
// The last hour, 12 points of 5 minutes: taking in the morning shade, then feeding back.
const HOUR=[310,280,260,180,90,-40,-180,-320,-420,-610,-780,-850];
// Today per hour, 0:00..15:00
const TODAY=[240,210,190,180,200,320,450,380,120,-260,-640,-910,-1020,-880,-540,-850];
const scale=(values,pad=6)=>{const top=Math.max(0,...values),bottom=Math.min(0,...values);return (v)=>pad+(top-v)/(top-bottom)*(H-2*pad);};
function line(values,{color,split,fillOpacity=.38}){
  const y=scale(values),step=W/(values.length-1),pts=values.map((v,i)=>[i*step,y(v)]);
  const d=pts.map(([x,yy],i)=>i?`L${x.toFixed(1)} ${yy.toFixed(1)}`:`M${x} ${yy}`).join(' ');
  const zero=y(0);
  const area=`${d} L${W} ${zero} L0 ${zero} Z`;
  if(!split) return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="${color}" opacity=".16"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  const id=Math.random().toString(36).slice(2);
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>
   <clipPath id="a${id}"><rect x="0" y="0" width="${W}" height="${zero}"/></clipPath><clipPath id="b${id}"><rect x="0" y="${zero}" width="${W}" height="${H-zero}"/></clipPath>
   <linearGradient id="ga${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d55181" stop-opacity="${fillOpacity}"/><stop offset="1" stop-color="#d55181" stop-opacity=".04"/></linearGradient>
   <linearGradient id="gb${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6bab3e" stop-opacity="${fillOpacity}"/><stop offset="1" stop-color="#6bab3e" stop-opacity=".04"/></linearGradient></defs>
   <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="rgba(245,244,239,.16)" stroke-width="1" vector-effect="non-scaling-stroke"/>
   <path d="${area}" fill="url(#ga${id})" clip-path="url(#a${id})"/><path d="${area}" fill="url(#gb${id})" clip-path="url(#b${id})"/>
   <path d="${d}" fill="none" stroke="#d55181" stroke-width="2" clip-path="url(#a${id})" vector-effect="non-scaling-stroke"/><path d="${d}" fill="none" stroke="#6bab3e" stroke-width="2" clip-path="url(#b${id})" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(values){
  const y=scale(values,4),zero=y(0),slot=W/values.length,width=slot*0.62;
  return `<svg class="graph" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="rgba(245,244,239,.16)"/>${values.map((v,i)=>{const yy=y(v);const top=Math.min(yy,zero),h=Math.max(1.5,Math.abs(yy-zero));return `<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${top.toFixed(1)}" width="${width.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${v<0?'#6bab3e':'#d55181'}" opacity="${i===values.length-1?1:.7}"/>`}).join('')}</svg>`;
}
const card=(isBack,graph,foot)=>`<div class="kicker">Categorie</div><h1>Energie</h1><div class="sec">Nu</div>
 <div class="card" style="--c:${isBack?'#6bab3e':'#d55181'}"><div class="top"><div><span class="lbl"><i></i>${isBack?'Terug naar het net':'Van het net'}</span><div class="big">${isBack?'850':'220'}<small>W</small></div></div><span class="badge"><i></i>Live</span></div>${graph}${foot}</div>`;
const S=[
 ['B1 · Het laatste uur, als lijn','Onderaan de kaart, over de volle breedte, zoals de tegels van Verbruik: het gemiddelde per 5 minuten van het laatste uur. Roze boven de nullijn, groen eronder, met een zachte vulling. Ververst elke 5 minuten.',card(true,line(HOUR,{split:true}),'<div class="axis"><span>1 uur geleden</span><span>nu</span></div>')],
 ['B2 · Vandaag, als staafjes per uur','Eén staafje per uur sinds middernacht: roze omhoog voor afnemen, groen omlaag voor terugleveren. Zo zie je in één oog wanneer de zon het overnam. Het huidige uur is feller.',card(true,bars(TODAY),'<div class="axis"><span>0:00</span><span>nu</span></div>')],
 ['B3 · Het laatste uur, zonder labels','Zoals B1, maar zonder de tijden eronder en zonder nullijn: alleen de vorm, nog rustiger. De kleur volgt wat er nu gebeurt.',card(true,line(HOUR,{split:true}).replace(/<line [^>]*\/>/,''),'')],
 ['B1 · van het net','',card(false,line(HOUR.map((v)=>Math.abs(v)*0.4+120),{split:true}),'<div class="axis"><span>1 uur geleden</span><span>nu</span></div>')],
 ['B2 · van het net','',card(false,bars(TODAY.map((v)=>v<0?v*0.3:v)),'<div class="axis"><span>0:00</span><span>nu</span></div>')],
 ['B3 · van het net','',card(false,line(HOUR.map((v)=>Math.abs(v)*0.4+120),{split:true}).replace(/<line [^>]*\/>/,''),'')],
];
document.body.innerHTML=S.map(([t,sub,h],k)=>`<div><p class="cap${k>=3?' short':''}">${t}${sub?`<small>${sub}</small>`:''}</p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
