<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Dagtegels met dagen</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(2,390px);gap:28px}
.cap{min-height:110px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--from:#d55181;--back:#6bab3e;
position:relative;width:390px;height:560px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 16px 12px;overflow:hidden}
.tile+.tile{margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.name{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.name span{display:grid;color:var(--c)}
.value{margin:6px 0 0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.value small{margin-left:3px;font-size:13px;font-weight:500;color:var(--muted)}
.extra{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}.extra b{color:var(--text)}
.progress{height:6px;border-radius:3px;background:rgba(0,0,0,.3);margin-top:10px;position:relative}.progress i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}.progress b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.under{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}.under b{color:var(--text)}
svg.chart{display:block;width:100%;margin-top:10px}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}

.days{display:grid;grid-template-columns:repeat(14,1fr);font-size:10px;color:var(--muted);text-align:center;margin-top:4px}.days span.today{color:var(--text);font-weight:600}
.price{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}.price small{font-size:12px;font-weight:500;color:var(--muted);margin-right:3px}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
const I={pylon:svg('<path d="M8 21l4-18 4 18M6 8h12M7 13h10M9.5 21l5-8M14.5 21l-5-8"/>'),sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')};
// 13 full days, then today so far
const TAKEN=[7.9,8.8,10.2,6.4,9.1,11.3,9.4,8.1,7.2,9.9,10.6,8.4,9.0,4.82];
const BACK=[3.1,4.6,1.2,0.8,2.9,5.1,6.4,4.2,2.2,0.6,1.8,3.9,5.0,6.10];
const avgOf=(values)=>values.slice(0,-1).slice(-7).reduce((sum,v)=>sum+v,0)/7;
const fmt=(v)=>v.toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2});

// Today is Wednesday 4 November; the 14 days run from Thursday 22 October.
const DAY_NAMES=['zo','ma','di','wo','do','vr','za'];
const dayLabels=(letters)=>{const today=3;return Array.from({length:14},(_,i)=>{const name=DAY_NAMES[(today-13+i+70)%7];return letters===1?name[0].toUpperCase():name;});};
function chart(values,color,letters){
  const W=326,H=64,avg=values.slice(0,-1).reduce((s,v)=>s+v,0)/13,top=Math.max(...values)*1.1,slot=W/values.length,width=slot*0.62;
  const y=(v)=>H-(v/top)*H;
  const rects=values.map((v,i)=>`<rect x="${(i*slot+(slot-width)/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${width.toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="2" fill="${color}" opacity="${i===values.length-1?1:.45}" stroke="none"/>`).join('');
  const avgY=y(avg);
  const label=`<g><rect x="0" y="${(avgY-16).toFixed(1)}" width="62" height="14" rx="4" fill="#262624" stroke="none" opacity=".9"/><text x="5" y="${(avgY-6).toFixed(1)}" font-size="10" fill="#f5f4ef" stroke="none">gem. ${fmt(avg)}</text></g>`;
  const labels=dayLabels(letters).map((name,i)=>`<span class="${i===13?'today':''}">${name}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${rects}<line x1="0" x2="${W}" y1="${avgY}" y2="${avgY}" stroke="#f5f4ef" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>${label}</svg><div class="days">${labels}</div>`;
}
const tile=(taken,letters)=>{const values=taken?TAKEN:BACK,today=values.at(-1),price=today*(taken?0.35:0.04);
 return `<div class="tile" style="--c:${taken?'#d55181':'#6bab3e'}"><p class="name"><span>${taken?I.pylon:I.sun}</span>${taken?'Afgenomen vandaag':'Teruggeleverd vandaag'}</p>
 <div class="top"><p class="value">${fmt(today)}<small>kWh</small></p><span class="price"><small>≈</small>€ ${fmt(price)}</span></div>${chart(values,taken?'#d55181':'#6bab3e',letters)}</div>`;};
const S=[
 ['D2 · Met de eerste letter van de dag','Het bedrag staat alleen, rechts naast het getal. Het gemiddelde is een label op de stippellijn ("gem. 8,94"), dus niet meer naast het bedrag. Onder elk staafje de eerste letter van de dag; vandaag is vet.',tile(true,1)+tile(false,1)],
 ['D2 · Met twee letters','Hetzelfde, maar "ma di wo …": met één letter zijn er twee D\'s (dinsdag, donderdag) en twee Z\'s (zaterdag, zondag).',tile(true,2)+tile(false,2)],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p><div class="phone"><div class="in">${h}</div></div></div>`).join('');
</script></html>
