<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Camera in een kamer</title><style>
body{margin:0;padding:32px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,390px);gap:28px}
.cap{min-height:96px;font-size:15px;font-weight:600;color:#3d3c38;margin:0 0 10px}.cap small{display:block;font-weight:400;color:#73726c;margin-top:3px;line-height:1.35}
.phone{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.18);
position:relative;width:390px;height:720px;border-radius:44px 44px 0 0;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12)}
.in{padding:26px 24px 0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 22px;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:34px}
.card{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px}.row+.row,.item+.item{box-shadow:inset 0 1px 0 var(--border)}
.tile{flex:none;width:36px;height:36px;border-radius:12px;background:var(--bg);color:var(--accent);display:grid;place-items:center}
.tile.on{background:var(--accent);color:#fff}
.txt{flex:1;min-width:0}.txt b{display:block;font-size:16px;font-weight:500}.txt small{font-size:13px;color:var(--muted)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--accent);position:relative}.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.go{padding:8px 16px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:600}
.chev{color:var(--muted)}.chev svg{width:18px;height:18px}
/* the fake camera picture */
.cam{position:relative;background:
 linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55)),
 linear-gradient(100deg,transparent 0 30%,rgba(255,240,200,.10) 30% 60%,transparent 60%),
 radial-gradient(60% 50% at 35% 72%,#55604f,transparent 70%),
 radial-gradient(40% 40% at 78% 30%,#46505a,transparent 70%),
 linear-gradient(180deg,#2d3530,#1a1f1c)}
.cam::before{content:"";position:absolute;left:12%;right:40%;bottom:18%;height:22%;border-radius:6px;background:linear-gradient(180deg,#3a4248,#262c30);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.cam .name{position:absolute;left:12px;bottom:10px;font-size:14px;font-weight:600;color:#fff}
.cam .time{position:absolute;right:12px;bottom:10px;font-size:12px;color:rgba(255,255,255,.75)}
/* A */
.thumb{flex:none;width:64px;height:36px;border-radius:10px;overflow:hidden}
/* B */
.below{margin:0 16px 14px 66px;aspect-ratio:16/9;border-radius:14px;overflow:hidden}
/* C */
.big{aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin-bottom:12px}
.play{position:absolute;inset:0;display:grid;place-items:center}.play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.play svg{width:18px;height:18px;margin-left:2px}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 20px 30px;border-radius:28px 28px 0 0;background:#2b2b29;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.handle{width:36px;height:5px;border-radius:3px;background:rgba(245,244,239,.18);margin:0 auto 16px}
.live{aspect-ratio:16/9;border-radius:18px;overflow:hidden}
.status{display:flex;align-items:center;gap:8px;margin:12px 4px 4px;font-size:13px;color:var(--muted)}.status i{width:8px;height:8px;border-radius:50%;background:#3fb950}
.sheet h2{margin:4px 4px 0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:24px}
.nav{position:absolute;left:16px;right:16px;bottom:16px;height:60px;border-radius:30px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
</style></head><body></body>
<script>
const svg=(inner)=>`<svg viewBox="0 0 24 24">${inner}</svg>`;
const I={bulb:svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'),
play:svg('<path d="M8 5v14l11-7z"/>'),chev:svg('<path d="M9 6l6 6-6 6"/>'),
camera:svg('<path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/>')};
const roomTop=`<div class="kicker">Kamer</div><h1>Garage</h1>`;
const light=`<div class="row"><span class="tile on">${I.bulb}</span><span class="txt"><b>Berging</b><small>Aan</small></span><span class="sw"></span></div>`;
const script=`<div class="row"><span class="tile">${I.play}</span><span class="txt"><b>Garagedeur</b><small>Script</small></span><span class="go">Start</span></div>`;
const pic=(cls,extra='')=>`<div class="cam ${cls}">${extra}</div>`;
const phone=(body,over='')=>`<div class="phone"><div class="in">${roomTop}${body}</div><div class="nav"></div>${over}</div>`;
const A=phone(`<div class="card">${light}${script}<div class="row">${pic('thumb')}<span class="txt"><b>Camera</b><small>Live bekijken</small></span><span class="chev">${I.chev}</span></div></div>`);
const B=phone(`<div class="card">${light}${script}<div class="item"><div class="row" style="padding-bottom:10px"><span class="tile">${I.camera}</span><span class="txt"><b>Camera</b><small>Bijgewerkt 11:42</small></span></div>${pic('below')}</div></div>`);
const C=phone(`${pic('big','<span class="name">Garage</span>')}<div class="card">${light}${script}</div>`);
const sheet=phone(`${pic('big','<span class="name">Garage</span>')}<div class="card">${light}${script}</div>`,`<div class="dim"></div><div class="sheet"><div class="handle"></div>${pic('live')}<div class="status"><i></i>WebRTC · lokaal</div><h2>Garage</h2></div>`);
const S=[
 ['A · Een rij met een miniatuur','Zoals elke andere bediening in de kaart: een klein stilstaand beeld (64×36) waar het icoon staat, de naam, "Live bekijken" en een pijltje. Het kleinst; je ziet weinig van het beeld.',A],
 ['B · Een rij met het beeld eronder','In de kaart, zoals de rolluikknoppen onder een rolluik: het icoon, de naam en de tijd van het beeld, met het stilstaande beeld (16:9) eronder, uitgelijnd met de naam.',B],
 ['C · Een grote tegel boven de kaart','Het beeld over de volle breedte (16:9, radius 18) met de naam linksonder, zoals de grote tegel op Thuis, boven de bedieningen.',C],
 ['Na een tik (voor alle drie)','De live-sheet die op Thuis al bestaat, met alleen deze camera: het live beeld, de statusregel en de naam. Vegen of sluiten stopt de stream.',sheet],
];
document.body.innerHTML=S.map(([t,sub,h])=>`<div><p class="cap">${t}<small>${sub}</small></p>${h}</div>`).join('');
</script></html>
