<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Nutsvoorzieningen – approved mockup</title>
<!-- Static design mockup for the Sonos media player. Open in a browser; not part of the build. --><style>
body{margin:0;padding:40px;background:#e9e6dd;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:flex;gap:36px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.cap{font-size:15px;font-weight:600;color:#3d3c38;text-align:center}.cap small{display:block;font-weight:400;color:#73726c;margin-top:2px}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.12);
--bg:#faf9f5;--surface:#fff;--text:#1f1e1d;--muted:#73726c;--border:rgba(31,30,29,.08);--accent:#c96442;--soft:rgba(201,100,66,.12);--track:rgba(31,30,29,.1)}
.phone.dark{--bg:#262624;--surface:#30302e;--text:#f5f4ef;--muted:#a6a39b;--border:rgba(245,244,239,.08);--accent:#d97757;--soft:rgba(217,119,87,.16);--track:rgba(245,244,239,.12)}
.in{padding:56px 24px 0}
.lbl{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{margin:0;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:33px;line-height:1.15}
.status{display:inline-flex;gap:10px;align-items:center;margin-top:16px;padding:10px 16px;font-size:15px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--soft);flex:none}
.sec{margin:30px 4px 12px;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;background:var(--soft)}
.hero b{display:block;font-size:17px}.hero span{font-size:14px;color:var(--muted)}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--accent);flex:none}
.hero .ic{background:var(--accent);color:#fff}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.card b{font-size:15px}.card span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 22px;background:linear-gradient(transparent,var(--bg) 35%)}
.pills{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08)}
.pill{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.pill svg{width:18px;height:18px}.pill.on{background:var(--accent);color:#fff}
/* mini player */
.mini{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px;margin-bottom:10px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08);position:relative;overflow:hidden}
.mini .art{width:44px;height:44px;border-radius:12px}
.mini .t{flex:1;min-width:0}.mini b{display:block;font-size:15px}.mini span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .prog{position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--accent)}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.round.acc{background:var(--accent);color:#fff}
/* album art */
.art{background:radial-gradient(circle at 30% 30%,#e9b98c,transparent 55%),radial-gradient(circle at 75% 70%,#7d5a4a,transparent 60%),linear-gradient(135deg,#c98b62,#4d3a33);flex:none}
.art.b{background:radial-gradient(circle at 70% 25%,#f4d7a1,transparent 50%),linear-gradient(160deg,#e28a5c,#7a3b4b)}
.art.c{background:radial-gradient(circle at 30% 70%,#9fc3c7,transparent 55%),linear-gradient(140deg,#4e7d8a,#23343d)}
.art.d{background:radial-gradient(circle at 60% 40%,#f1e3c6,transparent 50%),linear-gradient(135deg,#b9a07a,#5d5246)}
.art.e{background:radial-gradient(circle at 40% 40%,#c3b2f0,transparent 55%),linear-gradient(135deg,#7a64c9,#2f2a4f)}
.art.f{background:radial-gradient(circle at 70% 70%,#a6d6a9,transparent 55%),linear-gradient(135deg,#5d9a6a,#2c3d33)}
/* sheet */
.sheet{position:absolute;inset:0;padding:14px 24px 0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 18px}
.where{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
.where svg{width:16px;height:16px;color:var(--accent)}
.bigart{width:300px;height:300px;border-radius:26px;margin:22px auto 0;box-shadow:0 24px 50px rgba(77,58,51,.28)}
.title{margin-top:26px;font-family:ui-serif,"New York",Georgia,serif;font-size:28px;line-height:1.15}
.artist{font-size:16px;color:var(--muted);margin-top:4px}
.bar{height:4px;border-radius:2px;background:var(--track);margin-top:22px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:2px;background:var(--accent)}
.bar i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 4px}
.controls .muted{color:var(--muted)}.controls .on{color:var(--accent)}
.play{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px var(--soft)}
.play svg{width:30px;height:30px}
.controls svg{width:24px;height:24px}
.vol{position:relative;display:flex;align-items:center;height:40px;border-radius:999px;margin-top:20px;background:linear-gradient(to right,var(--soft) var(--p),var(--bg) var(--p));box-shadow:inset 0 0 0 1px var(--border)}
.surface .vol{background:linear-gradient(to right,var(--soft) var(--p),var(--surface) var(--p))}
.vol svg{position:absolute;left:14px;width:18px;height:18px;color:var(--accent)}
.vol .v{position:absolute;right:16px;font-size:13px;font-weight:600;color:var(--muted)}
.vol .knob{position:absolute;left:calc(var(--p) - 2px);width:4px;height:20px;border-radius:2px;background:var(--accent)}
.actions{display:flex;gap:10px;margin-top:18px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;font-weight:600}
.chip svg{width:18px;height:18px;color:var(--accent)}
/* speakers */
.group{margin-top:22px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.row{padding:14px 16px}.row+.row{box-shadow:inset 0 1px 0 var(--border)}
.rtop{display:flex;align-items:center;gap:14px}
.rtop .t{flex:1}.rtop b{display:block;font-size:16px;font-weight:500}.rtop span{font-size:13px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--track);display:grid;place-items:center;flex:none}
.check.on{background:var(--accent);box-shadow:none;color:#fff}.check svg{width:16px;height:16px;stroke-width:2.4}
.row .vol{margin:12px 0 2px 50px;height:34px}
.ic.on{background:var(--accent);color:#fff}
.done{margin-top:18px;height:50px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.sub{font-size:15px;color:var(--muted);margin-top:8px}
/* favorites */
.target{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;font-weight:500}
.target svg{width:16px;height:16px;color:var(--accent)}
.fav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tile .art{width:100%;aspect-ratio:1;border-radius:20px;position:relative}
.tile .art .pl{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#1f1e1d;display:grid;place-items:center}
.tile .art .pl svg{width:14px;height:14px}
.tile b{display:block;font-size:15px;margin-top:10px}.tile span{font-size:13px;color:var(--muted)}
.idle{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.idle b{display:block;font-size:15px}.idle span{font-size:13px;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-top:40px}
.topbar .t{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.topbar .t b{font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px}
.topbar svg{width:26px;height:26px;color:var(--text)}
.sp{flex:1}
.player{position:absolute;inset:0;padding:0 24px 34px;display:flex;flex-direction:column}
.player .bigart{width:342px;height:342px;margin:0;border-radius:24px}
.player .title{margin-top:0}
.thumb{width:72px;height:44px;border-radius:10px;flex:none;background:radial-gradient(circle at 70% 30%,#f2c48d,transparent 45%),radial-gradient(circle at 20% 80%,#3c6e8f,transparent 55%),linear-gradient(135deg,#7b4a3a,#1d2a33)}
.app{display:inline-flex;align-items:center;gap:6px}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--accent);letter-spacing:.02em}
.mini span.app{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.mini span.badge{display:inline-block;flex:none;color:var(--accent)}
.xp{margin-bottom:10px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 12px 32px rgba(0,0,0,.25);padding:14px}
.xp .hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:2px 4px 12px}
.xp .hd b{color:var(--text);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;margin-left:6px}
.xp .hd svg{width:22px;height:22px;color:var(--text)}
.xp .big{width:100%;aspect-ratio:16/9;border-radius:16px;background:radial-gradient(circle at 70% 30%,#f2c48d,transparent 45%),radial-gradient(circle at 20% 80%,#3c6e8f,transparent 55%),linear-gradient(135deg,#7b4a3a,#1d2a33)}
.xp .tt{margin-top:14px;padding:0 4px}
.xp .tt b{display:block;font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:22px;line-height:1.2}
.xp .tt span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}
.xp .bar{margin:16px 4px 0}.xp .times{margin:8px 4px 0}
.xp .ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:10px}
.xp .ctl .skip{position:relative;width:40px;height:40px;display:grid;place-items:center;color:var(--text)}
.xp .ctl .skip svg{width:28px;height:28px}
.xp .ctl .skip i{position:absolute;font-style:normal;font-size:9px;font-weight:700;top:15px}
.xp .play{width:60px;height:60px}.xp .play svg{width:24px;height:24px}
.xp .foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.xp .foot .vol{flex:1;margin:0}
.stop{height:40px;padding:0 16px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text);background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)}
.stack{margin-bottom:10px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08);overflow:hidden}
.stack .mini{margin:0;border-radius:0;box-shadow:none;background:transparent}
.stack .mini+.mini{box-shadow:inset 0 1px 0 var(--border)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.xp .close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,19,.55);color:#f5f4ef;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.xp .close svg{width:20px;height:20px}
.xp{padding-top:10px}
.xp .handle{width:36px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 10px}
.dots{display:flex;justify-content:center;gap:6px;margin:-2px 0 10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--text);width:16px;border-radius:3px}
.xp .dots{margin:0 0 10px}
.xp .handle{margin-bottom:8px}
.swipe{position:relative;height:72px;margin-bottom:10px}
.swipe .mini{position:absolute;top:0;width:100%;margin:0}
.cover{position:relative;overflow:hidden}
.cover .blur{position:absolute;inset:-40px;filter:blur(30px) saturate(1.1);opacity:.7}
.cover::after{content:"";position:absolute;inset:0;background:rgba(20,20,19,.45)}
.cover .sq{z-index:1}
.cover .sq{position:absolute;top:50%;left:50%;height:78%;width:auto;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
.ctl.wide{gap:40px}
.ctl .nx{width:40px;height:40px;display:grid;place-items:center;color:var(--text)}.ctl .nx svg{width:26px;height:26px}
.streams{margin-bottom:10px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08)}
.streams .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 2px 12px}
.streams .h svg{width:16px;height:16px;color:var(--accent)}
.chips{display:flex;gap:8px}
.st{flex:1;display:flex;align-items:center;gap:8px;min-width:0;height:44px;padding:0 12px 0 6px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;font-weight:600;white-space:nowrap}
.st .logo{width:32px;height:32px;border-radius:50%;flex:none}
.st.on{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--text)}
.st.busy{opacity:.75}
.st .spinwrap{display:grid;place-items:center;background:var(--surface)}
.st .spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--accent)}
.xp .chips{margin-top:12px}
.xp .slabel{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 4px 0}
.streams.compact{padding:10px}
.mm{margin-bottom:10px;padding:12px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:10px;min-height:122px;box-sizing:border-box}
.mm .top{display:flex;align-items:center;gap:12px}
.mm .top .art,.mm .top .itile{width:54px;height:54px;border-radius:14px;flex:none}
.mm .top .thumb{width:112px;height:63px;border-radius:12px}
.mm .t b.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.mm .itile{display:grid;place-items:center;background:var(--bg);color:var(--accent)}
.mm .itile svg{width:24px;height:24px}
.mm .t{flex:1;min-width:0}.mm .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .t span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.mm .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mm .chips{gap:8px}
.mm .chips{gap:6px}
.mm .st{height:34px;padding:0 10px 0 4px;gap:6px;font-size:13px}
.mm .st .logo{width:26px;height:26px}
.mm .st .spin{width:14px;height:14px}
.mm .pb{margin-top:auto}
.mm .pb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mm .pb .bar{flex:1;margin:0;height:4px}
.mm .pb .bar i::after{display:none}
.mm .btns{display:flex;align-items:center;gap:2px}
.scrolled{position:absolute;left:0;right:0;top:-330px;padding:56px 24px 0}
.statusfade{position:absolute;left:0;right:0;top:0;height:54px;background:linear-gradient(var(--bg) 60%,transparent);z-index:2}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#1b1c1d}
.cam .img{position:absolute;inset:0}
.cam .img.g{background:radial-gradient(ellipse at 30% 75%,rgba(160,150,130,.55),transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(90,100,110,.6),transparent 50%),linear-gradient(180deg,#3a3d40,#1f2123)}
.cam .img.b{background:radial-gradient(ellipse at 60% 70%,rgba(120,140,110,.55),transparent 55%),radial-gradient(ellipse at 20% 30%,rgba(200,180,140,.35),transparent 45%),linear-gradient(170deg,#2f3a33,#1a201c)}
.cam .img.z{background:radial-gradient(ellipse at 45% 80%,rgba(140,130,120,.5),transparent 60%),linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 40px),linear-gradient(160deg,#34322f,#1c1b1a)}
.cam .img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.cam .lb{position:absolute;left:12px;bottom:10px;z-index:1;color:#f5f4ef}
.cam .lb b{display:block;font-size:14px;font-weight:600}
.cam .lb span{font-size:12px;color:rgba(245,244,239,.7)}
.cam .ts{position:absolute;right:10px;top:10px;z-index:1;font-size:11px;font-variant-numeric:tabular-nums;color:rgba(245,244,239,.75);background:rgba(0,0,0,.35);padding:3px 7px;border-radius:999px}
.cam .mot{position:absolute;left:10px;top:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--accent);padding:4px 9px;border-radius:999px}
.cam .mot::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.cam.alert{box-shadow:0 0 0 2px var(--accent)}
.camgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.camgrid .cam.big{grid-column:1/3;aspect-ratio:16/9}
.camgrid .cam.sm{aspect-ratio:4/3}
.camrow{display:flex;gap:10px}
.camrow .cam{flex:1;aspect-ratio:3/4}
.camrow .cam .lb b{font-size:13px}
.contentpad{padding-bottom:230px}
.sheet2{position:absolute;left:0;right:0;bottom:0;top:70px;border-radius:28px 28px 0 0;background:var(--surface);box-shadow:0 -12px 40px rgba(0,0,0,.4);padding:10px 16px 0}
.sheet2 .handle{width:36px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 10px}
.sheet2 .live-img{aspect-ratio:16/9;width:100%}
.sheet2 .hdr{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 0}
.sheet2 .hdr b{font-family:ui-serif,"New York",Georgia,serif;font-weight:400;font-size:24px}
.livepill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.acts{display:flex;gap:8px;margin-top:14px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;font-weight:600}
.act svg{width:18px;height:18px;color:var(--accent)}
.evs{margin-top:18px}
.evs .sec{margin:0 4px 10px}
.ev{display:flex;align-items:center;gap:12px;padding:8px 4px}
.ev+.ev{box-shadow:inset 0 1px 0 var(--border)}
